<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Natal na Praça · Acampada Pixel</title>
<meta name="description" content="Mini-jogo de plataformas da Acampada Pixel: o mercado de Natal no Rossio e a pista de gelo na Praça D. João I querem o lugar das tendas.">
<meta name="theme-color" content="#0b0a0a">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Natal na Praça · Acampada Pixel">
<meta property="og:description" content="O mercado de Natal e a pista de gelo querem o lugar das tendas. Salta, escorrega e fica.">
<meta property="og:image" content="https://acampadapixel.pt/og.jpg?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{ --bg:#0b0a0a; --red:#d22a2a; --lime:#b6ff3b; --yel:#ffd23a; --ink:#f4f1ea; --dim:#a9a39a; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:Jost, 'Avenir Next', 'Helvetica Neue', system-ui, sans-serif; overflow:hidden;
  touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
#stage{ position:fixed; left:50%; top:0; transform:translateX(-50%); background:#000; }
canvas{ display:block; width:100%; height:100%; image-rendering:pixelated; }
#ov{ position:fixed; inset:0; z-index:5; display:flex; background:rgba(11,10,10,.92);
  padding:14px; box-sizing:border-box; overflow:auto; }
#ov[hidden]{ display:none; }
.card{ max-width:600px; text-align:center; margin:auto; } /* margin:auto centres it, and lets it scroll when it doesn't fit */
@media (max-height: 520px){ /* a phone on its side: smaller, so a level's screen fits with its button */
  #ov{ padding:10px max(14px, env(safe-area-inset-right)) 10px max(14px, env(safe-area-inset-left)); }
  .card{ max-width:720px; }
  h1{ font-size:34px; margin-bottom:6px; } h2{ font-size:24px; margin-bottom:6px; }
  p{ font-size:14px; line-height:1.3; margin-bottom:6px; } .kick{ margin-bottom:4px; } .stats{ margin:4px 0 6px; }
  .btns{ margin-top:6px; } button.big, a.big{ font-size:16px; padding:10px 22px; }
}
.kick{ font:400 clamp(10px,2.2vw,14px)/1.2 Silkscreen, monospace; color:var(--yel); letter-spacing:1px; margin:0 0 8px; }
h1{ font:800 clamp(30px,7.4vw,64px)/.88 Jost, 'Avenir Next', 'Helvetica Neue', sans-serif; color:var(--red); text-transform:uppercase; margin:0 0 10px; letter-spacing:-1px; }
h2{ font:800 clamp(22px,4.6vw,38px)/.95 Jost, 'Avenir Next', 'Helvetica Neue', sans-serif; text-transform:uppercase; margin:0 0 10px; }
p{ font:500 clamp(14px,2.4vw,18px)/1.35 Jost, 'Avenir Next', 'Helvetica Neue', sans-serif; color:#e8e2d6; margin:0 0 10px; }
p b{ color:var(--yel); }
.small{ font-size:clamp(12px,2vw,15px); color:var(--dim); }
.stats{ font:400 clamp(12px,2.4vw,16px)/1.6 Silkscreen, monospace; color:var(--lime); margin:6px 0 12px; }
.btns{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
button.big, a.big{ font:800 clamp(16px,3vw,22px)/1 Jost, 'Avenir Next', 'Helvetica Neue', sans-serif; text-transform:uppercase; background:var(--ink); color:var(--bg); border:0;
  padding:12px 26px; cursor:pointer; outline:3px solid var(--yel); outline-offset:3px; text-decoration:none; display:inline-block; }
a.big.alt, button.big.alt{ background:transparent; color:var(--ink); outline-color:var(--dim); }
#top{ position:absolute; right:8px; top:8px; display:flex; gap:8px; z-index:2; }
#top button{ font:700 16px/1 Jost, 'Avenir Next', 'Helvetica Neue', sans-serif; min-width:42px; height:42px; background:rgba(11,10,10,.6); color:var(--ink); border:1px solid rgba(244,241,234,.5); cursor:pointer; touch-action:manipulation; }
body.touch #top button{ min-width:48px; height:48px; font-size:18px; }
#pad{ position:fixed; left:0; right:0; bottom:0; display:none; justify-content:space-between; align-items:flex-end;
  padding:10px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); pointer-events:none; box-sizing:border-box; }
body.touch #pad{ display:flex; }
#pad .grp{ display:flex; gap:12px; }
#pad button{ pointer-events:auto; width:78px; height:78px; border-radius:50%; border:3px solid rgba(244,241,234,.75); background:rgba(11,10,10,.45);
  color:var(--ink); font:800 26px/1 Jost, 'Avenir Next', 'Helvetica Neue', sans-serif; touch-action:none; }
#pad button.jump{ width:96px; height:96px; font-size:15px; text-transform:uppercase; border-color:var(--yel); color:var(--yel); }
#pad button.on{ background:rgba(244,241,234,.35); }
body.portrait #pad{ background:var(--bg); padding-top:14px; }
/* phone on its side: the buttons go in the black bars beside the picture when there's room, otherwise smaller and see-through */
body.bars #pad .grp{ flex-direction:column; align-items:center; }
body.touch:not(.portrait):not(.bars) #pad button{ width:60px; height:60px; font-size:20px; opacity:.6; }
body.touch:not(.portrait):not(.bars) #pad button.jump{ width:72px; height:72px; font-size:12px; }
body.bars #pad{ padding-left:calc((var(--bar) - 78px) / 2); padding-right:calc((var(--bar) - 96px) / 2); align-items:center; top:0; }
#turn{ position:fixed; left:0; right:0; text-align:center; font:400 12px/1.3 Silkscreen, monospace; color:var(--dim); display:none; }
body.portrait #turn{ display:block; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1152" height="648"></canvas>
  <div id="top"><button id="bMute" aria-label="Som">♪︎</button><button id="bPause" aria-label="Pausa">II</button></div>
</div>
<div id="ov"></div>
<div id="turn"></div>
<div id="pad">
  <div class="grp"><button data-k="left" aria-label="Esquerda">◀︎</button><button data-k="right" aria-label="Direita">▶︎</button></div>
  <div class="grp"><button data-k="jump" class="jump" aria-label="Saltar">Saltar</button></div>
</div>
<script>
(() => {
'use strict';
/* Natal na Praça: a small platform game for Acampada Pixel (acampadapixel.pt), in two levels.
   1. Rossio, Lisboa: the Christmas market (13 Nov – 21 Dec) is put up where the camp stands. Price tags grow in your
      way, the mayor's order (the "despacho") flies about, the Polícia Municipal patrols. Carry your tent to the middle.
   2. Praça D. João I, Porto: the ice rink goes up from 13 Nov. The floor is slippery, a crane drops pieces of the rink,
      the rink's ice spreads across the square and the town hall's e-mails fly in. Peg the tents down before the ice gets them:
      a pegged tent stays, and the rink goes round it.
   The end: 24 November, the day the court gave the camp in Lisbon. The camp goes on, on its own terms.
   Everything is drawn here, on a 384x216 canvas (3x for crisp text); no images, no libraries. */
let LANG = 'pt';
try { LANG = localStorage.getItem('acampada-lang') || 'pt'; } catch (e) {} // the same choice as the main game
const L = (pt, en) => LANG === 'en' ? en : pt;

const W = 384, H = 216, SC = 3, GY = 184; // GY: the top of the ground
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const ov = document.getElementById('ov'), stage = document.getElementById('stage');
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');

// ---------- layout: the 16:9 stage as big as fits; on a phone held upright the buttons go below it
function fit() {
  const vw = innerWidth, vh = innerHeight, portrait = isTouch && vh > vw;
  document.body.classList.toggle('portrait', portrait);
  const room = portrait ? vh - 150 : vh;
  let w = Math.min(vw, room * 16 / 9), h = w * 9 / 16;
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  stage.style.top = portrait ? Math.max(0, (room - h) / 2) + 'px' : (vh - h) / 2 + 'px';
  const bar = (vw - w) / 2; document.body.classList.toggle('bars', isTouch && !portrait && bar >= 100); document.body.style.setProperty('--bar', bar + 'px');
  const turn = document.getElementById('turn'); if (turn) { turn.textContent = L('↻ Melhor com o telemóvel deitado', '↻ Better with the phone on its side'); turn.style.top = Math.max(8, (room - h) / 2 - 30) + 'px'; }
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 200)); fit();

// ---------- input
const keys = { left: false, right: false, jump: false };
let jumpPressed = false; // a jump asked for since the last step (kept a moment: jump buffer)
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyZ: 'jump' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k) { if (k === 'jump' && !keys.jump) jumpPressed = true; keys[k] = true; e.preventDefault(); audioOn(); }
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') toggleMute();
  if (e.code === 'Enter' && !ov.hidden) { e.preventDefault(); const b = ov.querySelector('button.big'); if (b) b.click(); }
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
// a finger lifted anywhere lets go of every button: a button must never stay pressed (then you can't stop by a tent)
addEventListener('touchend', e => { if (!e.touches.length) { keys.left = keys.right = keys.jump = false; for (const b of document.querySelectorAll('#pad button.on')) b.classList.remove('on'); } }, { passive: true });
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; });
for (const b of document.querySelectorAll('#pad button')) {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (x) {} if (k === 'jump' && !keys.jump) jumpPressed = true; keys[k] = true; b.classList.add('on'); audioOn(); };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
}

// ---------- sound: a few effects and "Jingle Bells" (Pierpont, 1857, public domain) on a little square wave
let actx = null, muted = false, master = null, musicOn = false, musicNext = 0, musicI = 0;
try { muted = localStorage.getItem('natal-mute') === '1'; } catch (e) {}
function audioOn() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(actx.destination); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f, t0, dur, type = 'square', vol = .06, slide = 0) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0005, t0 + dur);
  o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + .02);
}
function sfx(k) {
  if (!actx || muted) return; const t = actx.currentTime;
  if (k === 'jump') tone(330, t, .14, 'square', .05, 2);
  else if (k === 'cravo') { tone(880, t, .07, 'square', .05); tone(1320, t + .07, .1, 'square', .05); }
  else if (k === 'hit') { tone(220, t, .25, 'sawtooth', .07, .4); }
  else if (k === 'save') { [523, 659, 784].forEach((f, i) => tone(f, t + i * .07, .12, 'triangle', .08)); }
  else if (k === 'grow') tone(140, t, .3, 'triangle', .06, 2.2);
  else if (k === 'thud') tone(90, t, .2, 'square', .07, .5);
  else if (k === 'tok') { tone(1200, t, .05, 'square', .07); tone(240, t, .1, 'triangle', .08); }
  else if (k === 'pum') { tone(160, t, .12, 'square', .09, .5); tone(80, t + .05, .25, 'sawtooth', .06); }
  else if (k === 'boing') tone(180, t, .22, 'triangle', .09, 3);
  else if (k === 'win') { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, t + i * .11, .2, 'square', .06)); }
  else if (k === 'check') { tone(660, t, .1, 'triangle', .07); tone(990, t + .1, .15, 'triangle', .07); }
  else if (k === 'freeze') tone(1600, t, .4, 'sine', .04, .5);
}
const NF = n => 440 * Math.pow(2, (n - 69) / 12); // MIDI note to Hz
const C5 = 72, D5 = 74, E5 = 76, F5 = 77, G5 = 79;
const SONG = [[E5,1],[E5,1],[E5,2],[E5,1],[E5,1],[E5,2],[E5,1],[G5,1],[C5,1.5],[D5,.5],[E5,4],[F5,1],[F5,1],[F5,1.5],[F5,.5],[F5,1],[E5,1],[E5,1],[E5,.5],[E5,.5],
  [E5,1],[D5,1],[D5,1],[E5,1],[D5,2],[G5,2],[E5,1],[E5,1],[E5,2],[E5,1],[E5,1],[E5,2],[E5,1],[G5,1],[C5,1.5],[D5,.5],[E5,4],[F5,1],[F5,1],[F5,1.5],[F5,.5],
  [F5,1],[E5,1],[E5,1],[E5,.5],[E5,.5],[G5,1],[G5,1],[F5,1],[D5,1],[C5,4],[0,4]];
function musicTick() {
  if (!actx || !musicOn || muted) return;
  const beat = .26; // seconds a quarter note
  while (musicNext < actx.currentTime + .25) {
    if (musicNext < actx.currentTime - .1) musicNext = actx.currentTime + .05;
    const [n, d] = SONG[musicI % SONG.length];
    if (n) { tone(NF(n), musicNext, d * beat * .9, 'square', .022); }
    if (musicI % 2 === 0) tone(NF((musicI % 8 < 4) ? 48 : 43), musicNext, beat * .8, 'triangle', .035); // a bass under it
    musicNext += d * beat; musicI++;
  }
}
function toggleMute() {
  muted = !muted; try { localStorage.setItem('natal-mute', muted ? '1' : '0'); } catch (e) {}
  if (master) master.gain.value = muted ? 0 : 1; document.getElementById('bMute').textContent = muted ? '♪︎̸' : '♪︎';
  if (!muted && actx) musicNext = actx.currentTime + .05;
}
document.getElementById('bMute').addEventListener('click', e => { audioOn(); toggleMute(); e.currentTarget.blur(); }); // blur: Space is for jumping
document.getElementById('bMute').textContent = muted ? '♪︎̸' : '♪︎';
document.getElementById('bPause').addEventListener('click', e => { togglePause(); e.currentTarget.blur(); });

// ---------- drawing helpers (world coordinates once the camera is applied)
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hash = (i, s = 1) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
const FF = f => f === 'Jost' ? "Jost, 'Avenir Next', 'Helvetica Neue', sans-serif" : 'Silkscreen, monospace'; // with a fallback if the fonts don't load
function text(t, x, y, size, color, align = 'center', font = 'Silkscreen', weight = '') {
  ctx.font = `${weight} ${size}px ${FF(font)}`.trim(); ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function outlined(t, x, y, size, color, align = 'center', font = 'Silkscreen', weight = '') {
  ctx.font = `${weight} ${size}px ${FF(font)}`.trim(); ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(11,10,10,.9)'; ctx.strokeText(t, x, y); ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function bubble(t, x, y) { // a speech bubble pointing down at (x, y)
  ctx.font = '700 7px ' + FF('Jost'); const w = Math.ceil(ctx.measureText(t).width) + 8, bx = Math.round(x - w / 2), by = Math.round(y - 14);
  R(bx, by, w, 11, '#f4f1ea'); R(bx - 1, by + 1, 1, 9, '#f4f1ea'); R(bx + w, by + 1, 1, 9, '#f4f1ea'); R(x - 1, by + 11, 3, 2, '#f4f1ea');
  text(t, x, by + 8, 7, '#0b0a0a', 'center', 'Jost', '700');
}

// ---------- the levels
// solids: { x, y, w, h, one } (one: only from above, the roofs of the stalls)
const PRICES = () => [
  { name: [L('PINA COLADA', 'PINA COLADA'), L('SEXY', 'SEXY')], price: '10€', max: 40, w: 60 },
  { name: [L('VINHO QUENTE', 'MULLED WINE'), 'VERY TYPICAL'], price: '6€', max: 30, w: 58 },
  { name: [L('CASTANHAS', 'CHESTNUTS')], price: '6€', max: 30, w: 46 },
];
function makeLevel(n) {
  const lv = { n, len: 4700, goal: 4540, stalls: [], tags: [], cops: [], cravos: [], checks: [], tents: [], camp: [], pushT: [], panels: [], flyers: [], floats: [], snow: [], skaters: [], need: 0 };
  if (n === 1) {
    lv.name = L('Rossio · Lisboa', 'Rossio · Lisbon'); lv.ice = false;
    const signs = ['PINA COLADA SEXY', L('VINHO QUENTE', 'MULLED WINE'), L('CASTANHAS', 'CHESTNUTS'), 'GINJINHA', L('BOLO-REI', 'KING CAKE'), L('FARTURAS', 'CHURROS'), L('ÍMANES', 'MAGNETS'), L('GORROS', 'BEANIES')];
    // each stretch: a stall, a camp tent to bounce on (a carnation high above it), a price tag (the tall ones, 10€, can
    // also be taken from the roof or the tent), then the open square: the Polícia Municipal, or a stall on wheels
    // pushing a tent out of the square (get there and stop by it to peg it down)
    const P = PRICES(), order = [2, 1, 0, 2, 0, 1, 0, 2, 1, 0, 1, 2], cols = ['#3a8fd8', '#55b05a', '#9b59d0', '#2bb3a8', '#f0b429'];
    let x = 250, i = 0;
    while (x < lv.goal - 300) {
      const w = 70 + (i % 3) * 6, tx = x + w + 95 + (i % 2) * 15, push = i % 2 === 1, next = x + (push ? 470 : 380) + (i % 3) * 20;
      lv.stalls.push({ x, w, sign: signs[i % signs.length] });
      lv.camp.push({ x: x + w + 30, col: cols[i % cols.length], sq: 0 });
      lv.tags.push({ x: tx, ...P[order[i % order.length]], g: 0, h: 10, cw: 18, grown: false });
      if (next < lv.goal - 200) {
        if (push) { // the cart stands by the next stall with a tent in front of it; it pushes the tent left, toward the tag
          const cw = 56, cx = next - 40 - cw, t0 = cx - 16, room = Math.min(140, t0 - (tx + 30 + 18));
          lv.pushT.push({ x: t0, x0: t0, room, cart: { x: cx, w: cw }, state: 'idle', fix: 0, col: cols[(i + 2) % cols.length], sq: 0, lostT: 0 });
        } else if (i > 0) lv.cops.push({ a: tx + 55, b: next - 45, x: tx + 80, y: GY - 19, dir: i % 2 ? 1 : -1, say: 0, sayT: rnd(1, 4), fall: 0, vx: 0 });
      }
      x = next; i++;
    }
    lv.camara = { x: Math.round(lv.goal * .52), say: L('Ai que horror!', 'Oh, how horrid!') };
    lv.flyEvery = [4, 6.5];
  } else {
    lv.name = L('Praça D. João I · Porto', 'Praça D. João I · Porto'); lv.ice = true;
    const cols = ['#e2533c', '#3a8fd8', '#f0b429', '#55b05a', '#9b59d0', '#2bb3a8', '#f08a24'];
    // the tents to save; some are being pushed toward the ice by a skater or by riot police with a baton
    for (let x = 380, i = 0; x < lv.goal - 200; x += 380 + (i % 2) * 40, i++) {
      const kind = i % 3 === 1 ? 'skate' : i % 3 === 2 ? 'choque' : null;
      lv.tents.push({ x, x0: x, saved: false, frozen: false, fold: 0, sq: 0, col: cols[i % cols.length], ppl: 1 + (i % 2),
        pusher: kind ? { kind, x: x + 16, state: 'idle', a: 0, b: 0, dir: -1, vx: 0 } : null });
    }
    lv.camara = { x: Math.round(lv.goal * .55), say: L('Absolutamente implacável!', 'Absolutely relentless!') };
    lv.need = 6; // tents to save to win
    // skaters going full speed up and down a stretch of the square: jump them
    lv.skaters = [[1500, 1820], [2700, 3020], [3800, 4120]].map(([a, b], i) => ({ a, b, x: a + (b - a) * hash(i, 5), dir: i % 2 ? 1 : -1, vx: 0, col: ['#e2533c', '#2bb3a8', '#f0b429'][i] }));
    [[1000, 1120], [2700, 2840]].forEach(([a, b]) => lv.cops.push({ a, b, x: a + 30, y: GY - 19, dir: 1, say: 0, sayT: rnd(1, 4), fall: 0, vx: 0 }));
    lv.flyEvery = [5, 7.5]; lv.mail = 3; // the town hall's e-mail, sent for the third time (and counting)
    lv.frost = { x: -170, v: 30, wait: 2.5 };
    lv.crane = { x: 200, tx: 200, state: 'wait', t: 2.5 };
  }
  lv.checks = [{ x: Math.round(lv.goal / 3), on: false }, { x: Math.round(lv.goal * 2 / 3), on: false }];
  // carnations to pick up: some on the ground, some on the roofs
  for (let x = 120; x < lv.goal - 60; x += 95) {
    // (a cart covers everything from where it stands to as far as it can push)
    const roof = lv.stalls.find(s => x > s.x + 8 && x < s.x + s.w - 8) || lv.pushT.find(p => x > p.cart.x - p.room - 4 && x < p.cart.x + p.cart.w + 4);
    const tag = lv.tags.find(tg => Math.abs(x - tg.x) < tg.w / 2 + 8);
    // one that falls where a price tag will grow goes on top of it (otherwise the tag swallows it); the same on a cart
    lv.cravos.push({ x: tag ? tag.x : x, y: tag ? GY - tag.max - 12 : roof ? GY - 52 : GY - 14 - (hash(x, 2) > .6 ? 26 : 0), got: false });

  if (P.stun > 0) { const hx = P.x + 5, hy = P.y - 2; for (let k = 0; k < 3; k++) { const a = t * 6 + k * 2.1; R(hx + Math.cos(a) * 7, hy + Math.sin(a) * 2, 2, 2, '#ffd23a'); } R(P.x + 6, P.y + 2, 1, 2, '#c81e1e'); if (P.stun < .7) R(P.x + 6, P.y + 4, 1, 1, '#c81e1e'); }
  for (const f of lvl.flyers) drawFlyer(f);
  for (const f of lvl.flyers) if (Math.abs(f.x - P.x) < 120 && f.x > P.x - 20) bubble(lvl.camara.say, f.x, f.y - f.h / 2 - 2);
  if (lvl.n === 2) { drawFrost(); for (const tn of lvl.tents) if (tn.saved && Math.abs(tn.x - camX - W / 2) < W) drawPegged(tn); }
  for (const f of lvl.floats) { ctx.globalAlpha = clamp(f.t / f.life * 2, 0, 1); outlined(f.s, f.x, f.y, 6, f.c, 'center', 'Jost', '800'); ctx.globalAlpha = 1; }
  ctx.restore();
  for (const s of lvl.snow) if (lvl.n === 2 || s.s === 2) R(s.x, s.y, s.s, s.s, lvl.n === 2 ? '#ffffff' : 'rgba(255,233,168,.6)');
  drawHUD();
}

// ---------- screens
function show(html) { ov.innerHTML = html; ov.hidden = false; const b = ov.querySelector('button.big'); if (b && !isTouch) b.focus(); }
function title() {
  mode = 'title'; lvl = null; stats = { cravos: 0, cravosAll: 0, tents: 0, tentsAll: 0, fixed: 0, fixedAll: 0 };
  show(`<div class="card"><p class="kick">ACAMPADA PIXEL · ${L('MINI-JOGO', 'MINI-GAME')}</p><h1>${L('Natal na praça', 'Christmas in the square')}</h1>
  <p>${L('O <b>mercado de Natal</b> quer o Rossio. A <b>pista de gelo</b> quer a Praça D. João I. A acampada pela habitação já lá está.', 'The <b>Christmas market</b> wants the Rossio. The <b>ice rink</b> wants Praça D. João I. The camp for housing is already there.')}</p>
  <p class="small">${isTouch ? L('◀︎ ▶︎ para andar, SALTAR para saltar.', '◀︎ ▶︎ to move, JUMP to jump.') : L('Setas ou A/D para andar · Espaço ou ↑ para saltar · P pausa · M som', 'Arrows or A/D to move · Space or ↑ to jump · P pause · M sound')}</p>
  <div class="btns"><button class="big" id="go">${L('Jogar', 'Play')} →</button><a class="big alt" href="./">${L('Acampada Pixel', 'Acampada Pixel')}</a></div>
  <p class="small" style="margin-top:14px"><a href="#" id="lang" style="color:var(--dim)">${LANG === 'en' ? 'Português' : 'English'}</a></p></div>`);
  document.getElementById('go').onclick = () => { audioOn(); intro(1); };
  document.getElementById('lang').onclick = e => { e.preventDefault(); LANG = LANG === 'en' ? 'pt' : 'en'; try { localStorage.setItem('acampada-lang', LANG); } catch (x) {} fit(); title(); };
}
function intro(n) {
  mode = 'intro';
  const body = n === 1
    ? L('Lisboa, 13 de novembro: as barracas do mercado de Natal começam a montar-se em cima da acampada. Leva a tua tenda até ao <b>centro da praça</b>. Salta as etiquetas de preços, foge do <b>despacho</b> e da <b>Polícia Municipal</b>. Há barracas sobre rodas a empurrar tendas: chega-te a elas e <b>martela 3 vezes</b> para as pregar (ao pé de uma tenda, o botão de saltar é o martelo). E salta nas tendas para ir mais alto!', 'Lisbon, 13 November: the Christmas market stalls go up on top of the camp. Carry your tent to the <b>middle of the square</b>. Jump the price tags, dodge the <b>order</b> and the <b>Municipal Police</b>. Stalls on wheels are pushing tents out: get to them and <b>hammer 3 times</b> to peg them down (by a tent, the jump button is the hammer). And bounce on the tents to go higher!')
    : L('Porto, 13 de novembro: começa a montagem da pista de gelo em frente ao Rivoli. O chão <b>escorrega</b>. O gelo da pista avança pela praça: chega-te a cada tenda e <b>martela 3 vezes</b> para a pregar antes que o gelo a apanhe: tenda pregada fica, e a pista que se desvie. Patinadores e polícia de choque empurram tendas para o gelo. Precisas de pregar pelo menos <b>6 tendas</b>. Cuidado com os patinadores, com a polícia de choque, com as peças que a grua larga (escorregam!) e com os e-mails da Câmara.', 'Porto, 13 November: the ice rink goes up in front of the Rivoli. The floor is <b>slippery</b>. The rink’s ice spreads across the square: get to each tent and <b>hammer 3 times</b> to peg it down before the ice gets it: a pegged tent stays, and the rink has to go round it. Skaters and riot police push tents onto the ice. You need to peg at least <b>6 tents</b>. Mind the skaters, the riot police, the pieces the crane drops (they slide!) and the town hall’s e-mails.');
  show(`<div class="card"><p class="kick">${L('NÍVEL', 'LEVEL')} ${n} / 2</p><h2>${n === 1 ? L('Rossio · Lisboa', 'Rossio · Lisbon') : 'Praça D. João I · Porto'}</h2><p>${body}</p>
  <div class="btns"><button class="big" id="go">${L('Começar', 'Start')} →</button></div></div>`);
  document.getElementById('go').onclick = () => { audioOn(); startLevel(n); };
}
function lostPorto() {
  if (mode !== 'lost') return;
  show(`<div class="card"><p class="kick">${L('PRAÇA D. JOÃO I', 'PRAÇA D. JOÃO I')}</p><h2>${L('O gelo apanhou demasiadas tendas', 'The ice caught too many tents')}</h2>
  <p>${L(`Para a acampada ficar são precisas pelo menos <b>${lvl.need} tendas pregadas</b>. Tenta outra vez!`, `The camp needs at least <b>${lvl.need} tents pegged down</b> to stay. Try again!`)}</p>
  <div class="btns"><button class="big" id="go">${L('Tentar outra vez', 'Try again')}</button></div></div>`);
  document.getElementById('go').onclick = () => { audioOn(); stats.cravos = lvl.c0; startLevel(2); };
}
function levelEnd() {
  stats.cravosAll += lvl.cravos.length;
  if (lvl.n === 1) {
    stats.fixed = lvl.pushT.filter(pt => pt.state === 'fixed').length; stats.fixedAll = lvl.pushT.length;
    show(`<div class="card"><p class="kick">${L('NÍVEL 1 · FEITO', 'LEVEL 1 · DONE')}</p><h2>${L('Tenda montada no Rossio', 'Tent up in the Rossio')}</h2>
    <p>${L('O tribunal deixou ficar até <b>24 de novembro</b>, dia da votação final do Orçamento. O mercado que se arranje ao lado.', 'The court let the camp stay until <b>24 November</b>, the day of the final budget vote. The market can fit in beside it.')}</p>
    <p class="stats">${L('CRAVOS', 'CARNATIONS')} ${stats.cravos}<br>${L('TENDAS PREGADAS', 'TENTS PEGGED')} ${stats.fixed} / ${stats.fixedAll}</p><div class="btns"><button class="big" id="go">${L('Seguir para o Porto', 'On to Porto')} →</button></div></div>`);
    document.getElementById('go').onclick = () => intro(2);
  } else {
    const saved = lvl.tents.filter(tn => tn.saved).length; stats.tents = saved; stats.tentsAll = lvl.tents.length;
    final();
  }
}
function final() {
  mode = 'end';
  show(`<div class="card"><p class="kick">24 ${L('DE NOVEMBRO', 'NOVEMBER')}</p><h1>${L('A acampada continua', 'The camp goes on')}</h1>
  <p>${L('Nem o mercado de Natal nem a pista de gelo. <b>Saímos nos nossos termos.</b>', 'Not for the Christmas market, not for the ice rink. <b>We leave on our own terms.</b>')}</p>
  <p class="stats">${L('CRAVOS', 'CARNATIONS')} ${stats.cravos} / ${stats.cravosAll}<br>${L('TENDAS PREGADAS NO ROSSIO', 'TENTS PEGGED IN THE ROSSIO')} ${stats.fixed} / ${stats.fixedAll}<br>${L('TENDAS QUE FICARAM NO PORTO', 'TENTS THAT STAYED IN PORTO')} ${stats.tents} / ${stats.tentsAll}</p>
  <div class="btns"><button class="big" id="go">${L('Jogar outra vez', 'Play again')}</button><a class="big alt" href="./">${L('Voltar à Acampada Pixel', 'Back to Acampada Pixel')}</a></div></div>`);
  document.getElementById('go').onclick = () => { stats = { cravos: 0, cravosAll: 0, tents: 0, tentsAll: 0, fixed: 0, fixedAll: 0 }; intro(1); };
}
function togglePause() { if (mode === 'play') { if (paused) resume(); else pause(); } }
function pause() { // a screen of its own, with big buttons (easy to hit on a phone)
  if (mode !== 'play' || paused) return; paused = true; keys.left = keys.right = keys.jump = false;
  document.getElementById('bPause').style.visibility = 'hidden';
  show(`<div class="card"><p class="kick">${lvl.name.toUpperCase()}</p><h2>${L('Pausa', 'Paused')}</h2>
  <div class="btns"><button class="big" id="go">▶︎ ${L('Continuar', 'Go on')}</button><button class="big alt" id="again">${L('Recomeçar o nível', 'Restart the level')}</button></div>
  <p class="small" style="margin-top:14px"><a href="#" id="quit" style="color:var(--dim)">${L('Sair para o início', 'Back to the start')}</a></p></div>`);
  document.getElementById('go').onclick = () => { audioOn(); resume(); };
  document.getElementById('again').onclick = () => { audioOn(); stats.cravos = lvl.c0; startLevel(lvl.n); };
  document.getElementById('quit').onclick = e => { e.preventDefault(); paused = false; document.getElementById('bPause').style.visibility = ''; musicOn = false; title(); };
}
function resume() {
  paused = false; ov.hidden = true; jumpPressed = false; document.getElementById('bPause').style.visibility = '';
  if (actx) musicNext = actx.currentTime + .05;
}
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play' && !paused) pause(); });

// ---------- the loop
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (lvl && (mode === 'play' || mode === 'done' || mode === 'lost') && !paused) { acc += dt; while (acc >= 1 / 120) { step(1 / 120); acc -= 1 / 120; } }
  else acc = 0;
  if (!paused && (mode === 'play')) musicTick();
  const jb = document.querySelector('#pad .jump'), want = hammerTarget() ? '🔨' : L('Saltar', 'Jump'); if (jb && jb.textContent !== want) jb.textContent = want;
  draw();
  requestAnimationFrame(frame);
}
// the canvas only asks for a font once it uses it: load them first (but don't wait more than 2 s for them)
const fontsIn = document.fonts ? Promise.all(['8px Silkscreen', '800 8px Jost', '700 8px Jost'].map(f => document.fonts.load(f).catch(() => {}))) : Promise.resolve();
Promise.race([fontsIn, new Promise(r => setTimeout(r, 2000))]).then(() => { title(); requestAnimationFrame(frame); });
})();
</script>
