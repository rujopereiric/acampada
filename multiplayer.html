<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Acampada Pixel · A Praça</title>
<meta name="description" content="A praça partilhada da Acampada: abre durante as manifestações pela habitação. Entra com o teu boneco, canta, dança com o DJ p.45 e escreve no mural.">
<meta name="theme-color" content="#0b0a0a">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Acampada · A Praça">
<meta property="og:description" content="A praça partilhada abre durante as manifestações pela habitação. Entra, canta e escreve no mural.">
<meta property="og:url" content="https://acampadapixel.pt/multiplayer.html">
<meta property="og:image" content="https://acampadapixel.pt/og.jpg?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{ --ink:#0b0a0a; --paper:#f4f1ea; --red:#b02a22; --redbox:#8b2320; --green:#4ba36f; --lime:#b6ff3b; --muted:#a39d97; color-scheme:dark; }
html{ height:100%; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; height:100%; overflow:hidden; background:var(--ink); color:var(--paper); font-family:Jost, Futura, "Trebuchet MS", sans-serif; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
button, input, select, textarea{ font:inherit; }
button{ cursor:pointer; touch-action:manipulation; }
.rough{ filter:url(#rough); }

/* the square: a bar on top, the square, the tools at the bottom (on wide screens the mural sits on the right) */
#app{ position:fixed; inset:0; display:grid; grid-template-rows:auto 1fr auto; padding:calc(env(safe-area-inset-top,0px) + 6px) 6px calc(env(safe-area-inset-bottom,0px) + 6px); gap:6px; }
#app[hidden]{ display:none; }
#bar{ display:flex; align-items:center; gap:10px; background:var(--paper); color:var(--ink); border:2px solid var(--paper); padding:6px 8px; min-width:0; }
.logo{ font-weight:800; font-size:20px; line-height:1; color:var(--red); letter-spacing:.3px; white-space:nowrap; }
#where{ font:700 11px/1.15 Jost, sans-serif; text-transform:uppercase; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
#where small{ display:block; font-weight:500; color:#5b554f; text-transform:none; font-size:11px; }
.cnt{ display:flex; gap:10px; font:800 18px/1 Jost, sans-serif; white-space:nowrap; }
.cnt span small{ display:block; font:700 9px/1 Jost, sans-serif; text-transform:uppercase; letter-spacing:.4px; color:#5b554f; margin-top:2px; }
.ib{ background:#fff; color:var(--ink); border:2px solid var(--ink); font:800 12px/1 Jost, sans-serif; min-width:32px; height:30px; padding:0 7px; text-transform:uppercase; }
.ib.on{ background:var(--ink); color:#fff; }
#stage{ position:relative; min-height:0; overflow:hidden; border:2px solid var(--paper); background:#1d1830; }
#cv{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:pointer; }
#tools{ display:flex; gap:6px; }
.tb{ flex:1; border:none; background:var(--paper); color:var(--ink); font:800 16px/1 Jost, sans-serif; text-transform:uppercase; padding:11px 6px 9px; }
.tb small{ display:block; font:500 11px/1 Jost, sans-serif; text-transform:none; margin-top:3px; color:#5b554f; }
.tb.red{ background:var(--redbox); color:#fff; } .tb.red small{ color:#f0c9c4; }
.tb.green{ background:var(--green); color:var(--ink); } .tb.green small{ color:#1f3a2a; }
.tb.new{ position:relative; } .tb.new::after{ content:''; position:absolute; top:6px; right:8px; width:10px; height:10px; border-radius:50%; background:var(--lime); border:2px solid var(--ink); }
.tb.open{ outline:3px solid var(--lime); outline-offset:-3px; }
.tb:active{ transform:translateY(2px); }

/* sheets over the bottom of the square: phrases, gestures, the mural */
.sheet{ position:absolute; left:0; right:0; bottom:0; max-height:72%; display:flex; flex-direction:column; background:rgba(11,10,10,.94); border-top:2px solid var(--paper); padding:10px; z-index:3; }
.sheet[hidden]{ display:none; }
.sheet h3{ margin:0 0 8px; font:800 14px/1 Jost, sans-serif; text-transform:uppercase; letter-spacing:.6px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.sheet h3 button{ background:none; border:2px solid var(--paper); color:var(--paper); font:800 12px/1 Jost, sans-serif; padding:4px 8px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:6px; overflow:auto; }
.grid button{ background:var(--paper); color:var(--ink); border:none; font:700 14px/1.15 Jost, sans-serif; padding:9px 8px 8px; text-align:left; }
.grid button.wait{ opacity:.45; }
.gest{ grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); }
.gest button{ text-align:center; } .gest button b{ display:block; font-size:24px; line-height:1.1; font-weight:400; }

/* the mural */
#muralList{ flex:1; min-height:60px; overflow:auto; display:flex; flex-direction:column; gap:6px; padding-right:2px; }
.msg{ background:var(--paper); color:var(--ink); padding:7px 9px 6px; position:relative; font:500 14px/1.3 "Helvetica Neue", Arial, sans-serif; word-wrap:break-word; }
.msg .who{ display:flex; align-items:center; gap:5px; font:700 11px/1 Jost, sans-serif; text-transform:uppercase; letter-spacing:.3px; margin-bottom:3px; color:#3a352e; }
.msg .dot{ width:9px; height:9px; border-radius:50%; border:1px solid var(--ink); flex:none; }
.msg .rep{ margin-left:auto; background:none; border:none; color:#8a837a; font:700 11px/1 Jost, sans-serif; padding:0 2px; }
.msg .rep:disabled{ color:#c4bdb3; cursor:default; }
.msg.mine{ background:#e4f5d6; }
.empty{ color:var(--muted); font-size:13px; text-align:center; padding:14px 0; }
.write{ display:flex; gap:6px; margin-top:8px; align-items:stretch; }
.write textarea{ flex:1; resize:none; height:52px; border:2px solid var(--paper); background:#fff; color:var(--ink); padding:6px 8px; font:500 15px/1.25 "Helvetica Neue", Arial, sans-serif; }
.write button{ border:none; background:var(--redbox); color:#fff; font:800 14px/1 Jost, sans-serif; text-transform:uppercase; padding:0 12px; }
.note{ display:flex; justify-content:space-between; gap:8px; font-size:11px; color:var(--muted); margin-top:4px; }
.note .err{ color:#ff9d8f; font-weight:700; }

/* who is here, by city */
.who-list{ display:flex; flex-wrap:wrap; gap:4px 10px; font:700 12px/1.3 Jost, sans-serif; margin:0 0 8px; }
.who-list span{ display:inline-flex; align-items:center; gap:4px; } .who-list i{ width:9px; height:9px; border-radius:50%; display:inline-block; }

#side{ display:contents; }
/* wide screens: the mural is always on the right */
@media (min-width: 900px) and (min-height: 520px){
  #app{ grid-template-columns:1fr 330px; grid-template-rows:auto 1fr auto; }
  #bar{ grid-column:1 / 3; }
  #stage{ grid-column:1; grid-row:2; }
  #tools{ grid-column:1; grid-row:3; }
  #side{ display:block; grid-column:2; grid-row:2 / 4; min-height:0; }
  #muralSheet{ position:static; max-height:none; height:100%; border:2px solid var(--paper); }
  #muralSheet[hidden]{ display:flex; }
  #tMural{ display:none; }
  #muralSheet .x{ display:none; }
}
#toast{ position:absolute; left:50%; bottom:62px; transform:translateX(-50%); background:var(--ink); color:var(--lime); border:2px solid var(--lime); font:700 13px/1.2 Jost, sans-serif; padding:6px 10px 5px; text-transform:uppercase; letter-spacing:.4px; z-index:4; max-width:90%; text-align:center; pointer-events:none; }
#toast[hidden]{ display:none; }
#djTag{ position:absolute; left:8px; bottom:8px; background:rgba(11,10,10,.8); color:var(--lime); font:700 11px/1 Jost, sans-serif; text-transform:uppercase; padding:5px 7px 4px; letter-spacing:.4px; z-index:2; pointer-events:none; }
#djTag[hidden]{ display:none; }
#aviso{ position:absolute; left:0; right:0; top:0; z-index:3; display:flex; align-items:center; gap:8px; background:var(--lime); color:var(--ink); font:800 15px/1.2 Jost, sans-serif; padding:8px 10px 7px; border-bottom:2px solid var(--ink); }
#aviso[hidden]{ display:none; } #aviso span{ flex:1; } #aviso span::before{ content:'📣 '; }
#aviso button{ background:none; border:none; font:800 16px/1 Jost, sans-serif; color:var(--ink); padding:2px 4px; }
.write.ro textarea{ background:#d9d3c3; } .write.ro button{ opacity:.5; }
.zoom{ position:absolute; right:8px; bottom:8px; z-index:2; width:44px; height:44px; background:var(--paper); color:var(--ink); border:2px solid var(--ink); font:800 22px/1 Jost, sans-serif; padding:0; }
@media (max-width: 520px){ #where small{ display:none; } .logo{ font-size:17px; } }

/* the entry and closed screens (the same poster style as the game's title screen) */
#ov{ position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 16px); overflow:auto; text-align:center; background:var(--ink); }
#ov[hidden]{ display:none; }
#ov .wrapc{ margin:auto; width:100%; max-width:440px; }
#ov h1,#ov h2,#ov p{ margin:0; }
.langsw{ display:flex; justify-content:center; margin:0 auto 12px; } .langsw button{ background:transparent; color:var(--paper); border:2px solid var(--paper); font:800 12px/1 Jost, sans-serif; letter-spacing:1px; padding:5px 10px 4px; } .langsw button + button{ border-left:0; } .langsw button.on{ background:var(--paper); color:var(--ink); }
.p-red{ color:var(--red); font-weight:800; font-size:clamp(30px, 9.5vw, 42px); line-height:1; letter-spacing:.5px; text-transform:uppercase; }
.p-big{ font-weight:800; font-size:clamp(28px, 9vw, 40px); line-height:1.02; text-transform:uppercase; }
.p-mid{ font-weight:700; font-size:19px; line-height:1.15; margin-top:6px !important; text-transform:uppercase; }
.help{ font-family:"Helvetica Neue", Arial, sans-serif; font-size:13px; line-height:1.4; color:#c9c4c4; margin:12px auto 0 !important; max-width:30em; }
.live{ background:var(--paper); color:var(--ink); text-align:left; padding:10px 12px 9px; margin-top:14px; border-left:8px solid var(--red); }
.live b{ display:block; font:800 16px/1.15 Jost, sans-serif; text-transform:uppercase; }
.live span{ font:500 13px/1.35 "Helvetica Neue", Arial, sans-serif; }
.live + .live{ margin-top:6px; }
.badge{ display:inline-block; background:var(--lime); color:var(--ink); font:800 12px/1 Jost, sans-serif; letter-spacing:1px; text-transform:uppercase; padding:5px 8px 4px; margin-bottom:10px; }
.badge.off{ background:var(--muted); }
.form{ text-align:left; margin-top:16px; display:grid; gap:12px; }
.form label{ display:block; font:800 12px/1 Jost, sans-serif; text-transform:uppercase; letter-spacing:.6px; margin-bottom:5px; }
.form input, .form select{ width:100%; border:2px solid var(--paper); background:#fff; color:var(--ink); font:600 17px/1.2 Jost, sans-serif; padding:9px 10px 8px; border-radius:0; }
.choice{ display:grid; gap:6px; }
.choice button{ text-align:left; background:transparent; color:var(--paper); border:2px solid var(--paper); padding:10px 12px 9px; }
.choice button b{ display:block; font:800 16px/1.1 Jost, sans-serif; text-transform:uppercase; }
.choice button span{ font:500 13px/1.3 "Helvetica Neue", Arial, sans-serif; color:#c9c4c4; }
.choice button.on{ background:var(--paper); color:var(--ink); } .choice button.on span{ color:#3a352e; }
.lookrow{ display:flex; align-items:center; gap:12px; }
#lookCv{ width:96px; height:96px; image-rendering:pixelated; background:#d9d3c3; border:2px solid var(--paper); }
.btnp{ font-family:Jost, Futura, sans-serif; font-weight:800; font-size:17px; text-transform:uppercase; background:#fff; color:var(--ink); border:none; padding:11px 18px 9px; margin:16px 4px 0; text-decoration:none; display:inline-block; }
.btnp.red{ background:var(--redbox); color:#fff; }
.btnp.sm{ font-size:13px; padding:8px 12px 7px; margin:0; }
.btnp:active{ transform:translateY(2px); }
.btnp:disabled{ opacity:.5; }
.foot{ margin-top:18px !important; font-size:11px; color:var(--muted); font-family:"Helvetica Neue", Arial, sans-serif; }
.foot a{ color:var(--paper); }
#ovMural{ text-align:left; margin-top:14px; display:flex; flex-direction:column; gap:6px; max-height:46vh; overflow:auto; }
:focus-visible{ outline:3px solid var(--lime); outline-offset:2px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/></filter></svg>

<div id="app" hidden>
  <header id="bar">
    <a class="logo rough" href="./" id="logo" title="Acampada">A PRAÇA</a>
    <div id="where"></div>
    <div class="cnt" id="cnt"></div>
    <button class="ib" id="bSound" aria-label="Som">♪</button>
    <button class="ib" id="bLang">EN</button>
  </header>
  <div id="stage">
    <canvas id="cv" aria-label="A praça partilhada"></canvas>
    <div id="toast" hidden></div>
    <div id="djTag" hidden></div>
    <div id="aviso" hidden><span id="avisoTxt"></span><button id="avisoX" aria-label="Fechar">✕</button></div>
    <button id="bZoom" class="zoom" aria-label="Zoom">＋</button>
    <div class="sheet" id="phraseSheet" hidden><h3><span data-t="phrases"></span><button class="x" data-close>✕</button></h3><div class="grid" id="phraseGrid"></div></div>
    <div class="sheet" id="gestSheet" hidden><h3><span data-t="gestures"></span><button class="x" data-close>✕</button></h3><div class="grid gest" id="gestGrid"></div></div>
  </div>
  <nav id="tools">
    <button class="tb" id="tPhrase"><span data-t="say"></span><small data-t="sayS"></small></button>
    <button class="tb green" id="tGest"><span data-t="gest"></span><small data-t="gestS"></small></button>
    <button class="tb red" id="tMural"><span data-t="mural"></span><small data-t="muralS"></small></button>
  </nav>
  <aside id="side">
    <div class="sheet" id="muralSheet" hidden>
      <h3><span data-t="muralT"></span><button class="x" data-close>✕</button></h3>
      <div class="who-list" id="whoList"></div>
      <div id="muralList"></div>
      <div class="write"><textarea id="muralIn" maxlength="140" rows="2"></textarea><button id="muralSend" data-t="send"></button></div>
      <div class="note"><span id="muralErr"></span><span id="muralCnt">0/140</span></div>
    </div>
  </aside>
</div>

<div id="ov"><div class="wrapc" id="ovIn"></div></div>

<script>
(() => {
'use strict';
/* ================= Acampada Pixel · the shared square =================
   Open only around the protests in manifestacoes.json (see the server in /servidor). People at a protest or a camp
   walk in the square with a little avatar, glowing in their city's colour; people elsewhere count as support and
   write on the mural. Phrases are a fixed list (nothing typed reaches the square), the mural is filtered and
   reported by the people in it, and everything is deleted 24 h after the square closes. */

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let LANG = store.get('acampada-lang') || ((navigator.language || '').toLowerCase().startsWith('pt') ? 'pt' : 'en');
const L = (pt, en) => LANG === 'en' ? en : pt;

const qs = new URLSearchParams(location.search);
const SRV = qs.get('srv') || (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? `http://${location.hostname}:8787` : 'https://praca.acampadapixel.pt');
const WS_URL = SRV.replace(/^http/, 'ws') + '/ws';

/* ---------- the same colours as the game ---------- */
const SKIN = ['#f1c9a5', '#d9a37a', '#a8714a', '#7a4a2c', '#5a3520'];
const HAIR = ['#2b1a10', '#1a1a24', '#6b3a1e', '#d9b46a', '#b03a5a', '#3a4fa8'];
const SHIRTS = ['#ffd23a', '#3ec46d', '#2f8fff', '#9a6bff', '#ff7ad9', '#f2efe6', '#444a77', '#2ad1c9', '#ff8a2a'];
const PANTS = ['#2b2d55', '#3a3a44', '#4a6fa5', '#5a3a6b'];
const LOOKS = SKIN.length * HAIR.length * SHIRTS.length;
const lookOf = n => { n = Math.abs(n | 0) % LOOKS; const s = n % 5, h = Math.floor(n / 5) % 6, c = Math.floor(n / 30) % 9; return { skin: SKIN[s], hair: HAIR[h], shirt: SHIRTS[c], pants: PANTS[(s + h + c) % 4] }; };
const CITIES = ['Faro', 'Coimbra', 'Braga', 'Lisboa', 'Porto'];
const AURA = { Faro: '#7fd6ff', Coimbra: '#ff8a2a', Braga: '#3ec46d', Lisboa: '#e2283b', Porto: '#2f5bff' };
const auraOf = c => AURA[c] || '#ffffff';
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };

/* ---------- what people can say: a fixed list, shown in each person's language ---------- */
const PHRASES = [
  ['Casa para viver!', 'Homes to live in!'],
  ['A habitação é um direito!', 'Housing is a right!'],
  ['Baixem as rendas, subam os salários!', 'Lower rents, raise wages!'],
  ['Paz, pão, saúde, habitação!', 'Peace, bread, health, housing!'],
  ['Não temos casa, ficam as tendas!', 'No homes? Then the tents stay!'],
  ['Na rua nos querem, na rua nos verão!', 'They want us on the street? Then they’ll see us there!'],
  ['Ninguém fica sem casa!', 'Nobody left without a home!'],
  ['Olá!', 'Hello!'],
  ['De onde vens?', 'Where are you from?'],
  ['Força!', 'Stay strong!'],
  ['Obrigada!', 'Thank you!'],
  ['Vamos dançar com o DJ?', 'Shall we dance with the DJ?'],
  ['Até à próxima manif!', 'See you at the next protest!'],
  ['Não estão sozinhos!', 'You are not alone!']
];
const GESTURES = [null,
  { i: '👋', pt: 'Acenar', en: 'Wave' }, { i: '✊', pt: 'Punho', en: 'Fist' }, { i: '👏', pt: 'Palmas', en: 'Clap' },
  { i: '❤️', pt: 'Coração', en: 'Heart' }, { i: '✌️', pt: 'Paz', en: 'Peace' }, { i: '🎉', pt: 'Festa', en: 'Party' }, { i: '📣', pt: 'Megafone', en: 'Megaphone' }];

const TXT = {
  phrases: ['Gritar uma palavra de ordem', 'Shout a slogan'], gestures: ['Fazer um gesto', 'Make a gesture'],
  say: ['Gritar', 'Shout'], sayS: ['Palavras de ordem', 'Slogans'], gest: ['Gestos', 'Gestures'], gestS: ['Acenar, palmas…', 'Wave, clap…'],
  mural: ['Mural', 'Wall'], muralS: ['Mensagens', 'Messages'], muralT: ['Mural da praça', 'The square’s wall'], send: ['Enviar', 'Send']
};
function applyTexts() {
  document.documentElement.lang = LANG === 'en' ? 'en' : 'pt-PT';
  for (const el of document.querySelectorAll('[data-t]')) { const t = TXT[el.dataset.t]; if (t) el.textContent = L(t[0], t[1]); }
  $('bLang').textContent = LANG === 'en' ? 'PT' : 'EN'; $('bLang').setAttribute('aria-label', L('Mudar para inglês', 'Switch to Portuguese'));
  $('muralIn').placeholder = L('Escreve ao resto da praça (140 letras, sem links)', 'Write to the rest of the square (140 letters, no links)');
  buildSheets(); renderWhere(); renderCounts(); renderMural(); renderMuralLock();
}

/* ================= the world: an isometric square, drawn like the game ================= */
const TW = 12, TH = 6;
let W = 22, H = 22, CXg = 11, CYg = 11;
const G0 = -8, G1 = 30; // the world around the square, in tiles
let OX = 0, OY = 0, WORLD_W = 0, WORLD_H = 0;
const iso = (gx, gy, z = 0) => ({ x: OX + (gx - gy) * TW, y: OY + (gx + gy) * TH - z });
const toWorld = (sx, sy) => { const a = (sx - OX) / TW, b = (sy - OY) / TH; return { gx: (a + b) / 2, gy: (b - a) / 2 }; };
const lerpY = (P, Q, x) => P.y + (Q.y - P.y) * ((x - P.x) / ((Q.x - P.x) || 1));
const hash = (x, y) => { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const shadeCache = new Map();
function shade(hex, f) { const k = hex + '|' + f; let o = shadeCache.get(k); if (o) return o; const n = parseInt(hex.slice(1, 7), 16), c = v => clamp(Math.round(v * f), 0, 255); o = '#' + ((1 << 24) | (c(n >> 16 & 255) << 16) | (c(n >> 8 & 255) << 8) | c(n & 255)).toString(16).slice(1); shadeCache.set(k, o); return o; }
function R(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
function vl(g, x, y0, y1, c) { const a = Math.round(y0), b = Math.round(y1); if (b < a) return; g.fillStyle = c; g.fillRect(x, a, 1, b - a + 1); }
function box(g, x0, y0, x1, y1, z0, h, cT, cL, cR) {
  const A = iso(x0, y0, z0 + h), B = iso(x1, y0, z0 + h), C = iso(x1, y1, z0 + h), D = iso(x0, y1, z0 + h);

const hhmm = t => new Intl.DateTimeFormat(LANG === 'en' ? 'en-GB' : 'pt-PT', { timeZone: 'Europe/Lisbon', hour: '2-digit', minute: '2-digit' }).format(new Date(t));
function msgEl(m, canReport) {
  const d = document.createElement('div'); d.className = 'msg' + (mine.has(m.id) ? ' mine' : '');
  const who = document.createElement('div'); who.className = 'who';
  const dot = document.createElement('i'); dot.className = 'dot'; dot.style.background = auraOf(m.city);
  who.append(dot, `${m.name} · ${m.city} · ${hhmm(m.at)}`);
  if (canReport && !mine.has(m.id)) {
    const r = document.createElement('button'); r.className = 'rep'; r.textContent = reported.has(m.id) ? L('Denunciado', 'Reported') : L('⚑ Denunciar', '⚑ Report'); r.disabled = reported.has(m.id);
    r.title = L('Três denúncias escondem a mensagem', 'Three reports hide the message');
    r.addEventListener('click', () => { send({ t: 'report', id: m.id }); reported.add(m.id); store.set('acampada-praca-rep', JSON.stringify([...reported].slice(-200))); r.textContent = L('Denunciado', 'Reported'); r.disabled = true; });
    who.append(r);
  }
  const tx = document.createElement('div'); tx.textContent = m.text;
  d.append(who, tx); return d;
}
function renderMural(scroll) {
  const box = $('muralList'); if (!box) return;
  const atEnd = box.scrollTop + box.clientHeight > box.scrollHeight - 30;
  box.innerHTML = '';
  if (!mural.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = L('Ainda ninguém escreveu. Sê a primeira pessoa!', 'Nobody has written yet. Be the first!'); box.appendChild(e); }
  for (const m of mural) box.appendChild(msgEl(m, true));
  if (scroll || atEnd) box.scrollTop = box.scrollHeight;
}
function sendMural() {
  const t = $('muralIn').value.trim(); if (!t) return;
  $('muralErr').textContent = ''; send({ t: 'mural', text: t }); $('muralIn').value = ''; $('muralCnt').textContent = '0/140';
}
$('muralSend').addEventListener('click', sendMural);
$('muralIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMural(); } });
$('muralIn').addEventListener('input', () => { $('muralCnt').textContent = `${$('muralIn').value.length}/140`; $('muralErr').textContent = ''; });

/* ---------- the top bar ---------- */
const sum = o => Object.values(o || {}).reduce((a, b) => a + b, 0);
function renderCounts() {
  $('cnt').innerHTML = `<span>${sum(counts.praca)}<small>${L('Na praça', 'In the square')}</small></span><span>${sum(counts.apoio)}<small>${L('De longe', 'From afar')}</small></span>`;
  const all = {}; for (const k of ['praca', 'apoio']) for (const [c, n] of Object.entries(counts[k] || {})) all[c] = (all[c] || 0) + n;
  const wl = $('whoList'); wl.innerHTML = '';
  for (const [c, n] of Object.entries(all).sort((a, b) => b[1] - a[1])) { const s = document.createElement('span'); const i = document.createElement('i'); i.style.background = auraOf(c); s.append(i, `${c} ${n}`); wl.appendChild(s); }
}
function renderWhere() {
  const w = live && live[0];
  const title = w ? (w.city ? w.city + ': ' : '') + w.title : L('Praça partilhada', 'Shared square');
  const close = closeAt ? L(`fecha às ${hhmm(closeAt)}`, `closes at ${hhmm(closeAt)}`) : L('aberta até a organização fechar', 'open until the organisers close it');
  const meLine = myMode === 'praca' ? L('estás na praça', 'you’re in the square') : L('estás como apoio de longe', 'you’re supporting from afar');
  $('where').innerHTML = ''; $('where').append(title); const s = document.createElement('small'); s.textContent = [meLine, close].filter(Boolean).join(' · '); $('where').append(s);
}
function renderAll() { applyTexts(); $('tPhrase').hidden = $('tGest').hidden = myMode !== 'praca'; }
let toastT = 0;
function toast(t, ms) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); if (ms) toastT = setTimeout(hideToast, ms); }
function hideToast() { $('toast').hidden = true; }
function showApp() { $('ov').hidden = true; $('app').hidden = false; requestAnimationFrame(() => { resize(); }); }

/* ================= the entry and closed screens ================= */
let lastStatus = null;
const fmtWhen = t => new Intl.DateTimeFormat(LANG === 'en' ? 'en-GB' : 'pt-PT', { timeZone: 'Europe/Lisbon', weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }).format(new Date(t));
function inTime(ms) {
  const m = Math.max(1, Math.round(ms / 60e3)), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60), mm = m % 60;
  const parts = []; if (d) parts.push(L(`${d} ${d === 1 ? 'dia' : 'dias'}`, `${d} ${d === 1 ? 'day' : 'days'}`)); if (h) parts.push(`${h} h`); if (!d && mm) parts.push(`${mm} min`);
  return parts.join(' ');
}
async function getStatus() {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 6000);
  try { const r = await fetch(SRV + '/estado', { signal: ctl.signal, cache: 'no-store' }); if (!r.ok) throw 0; return await r.json(); } finally { clearTimeout(to); }
}
function langSw() { return `<div class="langsw" role="group" aria-label="Idioma / Language"><button data-l="pt" class="${LANG === 'pt' ? 'on' : ''}">PT</button><button data-l="en" class="${LANG === 'en' ? 'on' : ''}">EN</button></div>`; }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function liveCard(w) { return `<div class="live"><b>${esc(w.city ? w.city + ': ' : '')}${esc(w.title)}</b><span>${esc(fmtWhen(w.start))}${w.where ? ' · ' + esc(w.where) : ''}</span></div>`; }
const FOOT = () => `<p class="foot">${L('Não guardamos nada que te identifique. O mural é apagado 24 horas depois de a praça fechar.', 'Nothing that identifies you is kept. The wall is deleted 24 hours after the square closes.')}<br><a href="./">${L('← Voltar ao jogo', '← Back to the game')}</a></p>`;
let statusTimer = 0;
async function showStatus(st) {
  $('app').hidden = true; $('ov').hidden = false; clearTimeout(statusTimer);
  const box = $('ovIn');
  if (!st) {
    box.innerHTML = `${langSw()}<h1 class="p-red rough">${L('A Praça', 'The Square')}</h1><p class="help">${L('A ver se a praça está aberta…', 'Checking whether the square is open…')}</p>`; wireLang();
    try { st = await getStatus(); } catch (e) {
      box.innerHTML = `${langSw()}<h1 class="p-red rough">${L('A Praça', 'The Square')}</h1><p class="p-mid rough">${L('Sem ligação à praça', 'Can’t reach the square')}</p><p class="help">${L('Verifica a internet e tenta outra vez.', 'Check your connection and try again.')}</p><button class="btnp" id="again">${L('Tentar outra vez', 'Try again')}</button>${FOOT()}`;
      wireLang(); $('again').addEventListener('click', () => showStatus()); return;
    }
  }
  lastStatus = st; clockOff = (st.now || Date.now()) - Date.now();
  if (st.open) { live = st.live || []; closeAt = st.close; return entryScreen(st); }
  closedScreen(st);
}
function wireLang() { for (const b of $('ovIn').querySelectorAll('.langsw button')) b.addEventListener('click', () => { LANG = b.dataset.l; store.set('acampada-lang', LANG); applyTexts(); showStatus(lastStatus); }); }
function bannedScreen() {
  $('app').hidden = true; $('ov').hidden = false; clearTimeout(statusTimer);
  $('ovIn').innerHTML = `${langSw()}<h1 class="p-red rough">${L('A Praça', 'The Square')}</h1><p class="p-mid rough">${L('A organização retirou-te da praça', 'The organisers removed you from the square')}</p><p class="help">${L('Podes voltar quando esta praça fechar e abrir a próxima.', 'You can come back once this square closes and the next one opens.')}</p>${FOOT()}`;
  for (const b of $('ovIn').querySelectorAll('.langsw button')) b.addEventListener('click', () => { LANG = b.dataset.l; store.set('acampada-lang', LANG); applyTexts(); bannedScreen(); });
}
function closedScreen(st) {
  const box = $('ovIn'), n = st.next;
  box.innerHTML = `${langSw()}<span class="badge off">${L('Fechada', 'Closed')}</span><h1 class="p-red rough">${L('A Praça', 'The Square')}</h1><p class="p-big rough">${L('Abre nas manifs e assembleias', 'Opens for protests and assemblies')}</p>
  ${st.by === 'fechada' ? `<p class="p-mid rough" style="margin-top:10px !important">${L('Fechada pela organização', 'Closed by the organisers')}</p>` : ''}
  <p class="help">${L('A praça partilhada abre antes das manifestações pela habitação e das assembleias. Quem está na manif ou numa acampada entra com o seu boneco; quem está longe dá apoio e escreve no mural.', 'The shared square opens before housing protests and assemblies. People at the protest or a camp walk in with their avatar; people far away send support and write on the wall.')}</p>
  ${n ? `<p class="p-mid rough" id="ovCount" style="margin-top:16px !important">${L('Abre daqui a', 'Opens in')} ${esc(inTime(n.open - serverNow()))}</p>${liveCard(n)}` : `<p class="help">${L('Ainda não há nada marcado. Volta em breve!', 'Nothing is scheduled yet. Come back soon!')}</p>`}
  <div id="ovMural"></div>${FOOT()}`;
  wireLang();
  fetch(SRV + '/mural', { cache: 'no-store' }).then(r => r.json()).then(j => { const ms = j.mural || []; if (!ms.length) return; const b = $('ovMural'); if (!b) return; const h = document.createElement('p'); h.className = 'p-mid'; h.style.textAlign = 'center'; h.textContent = L('O mural da última praça', 'The wall from the last square'); b.append(h); for (const m of ms.slice(-40).reverse()) b.append(msgEl(m, false)); }).catch(() => {});
  const tick = async () => {
    let s2 = null; try { s2 = await getStatus(); } catch (e) {}
    if ($('ov').hidden) return;
    if (s2) { lastStatus = s2; clockOff = (s2.now || Date.now()) - Date.now(); if (s2.open) return showStatus(s2); }
    const c = $('ovCount'), nx = (s2 || st).next; if (c && nx) c.textContent = `${L('Abre daqui a', 'Opens in')} ${inTime(nx.open - serverNow())}`;
    statusTimer = setTimeout(tick, nx ? clamp(nx.open - serverNow() + 2000, 5000, 60e3) : 60e3);
  };
  statusTimer = setTimeout(tick, n ? clamp(n.open - serverNow() + 2000, 5000, 60e3) : 60e3);
}
function entryScreen(st) {
  const box = $('ovIn'), p = profile;
  const opts = CITIES.map(c => `<option value="${c}"${p.city === c ? ' selected' : ''}>${c}</option>`).join('') + `<option value="_"${p.city === '_' ? ' selected' : ''}>${L('Outra cidade', 'Another city')}</option>`;
  box.innerHTML = `${langSw()}<span class="badge">${L('Aberta agora', 'Open now')}</span><h1 class="p-red rough">${L('A Praça', 'The Square')}</h1><p class="p-mid rough">${L('Todas as acampadas, numa praça', 'Every camp, one square')}</p>
  ${(st.live || []).map(liveCard).join('')}
  <p class="help">${st.close ? L(`Fecha às ${hhmm(st.close)}.`, `Closes at ${hhmm(st.close)}.`) : L('Aberta até a organização fechar.', 'Open until the organisers close it.')} ${L(`Agora: ${sum(st.counts && st.counts.praca)} na praça, ${sum(st.counts && st.counts.apoio)} de longe.`, `Right now: ${sum(st.counts && st.counts.praca)} in the square, ${sum(st.counts && st.counts.apoio)} from afar.`)}</p>
  ${st.aviso ? `<p class="live" style="border-left-color:var(--lime)"><b>📣 ${esc(st.aviso)}</b></p>` : ''}
  <div class="form">
    <div><label for="fName">${L('O teu nome na praça', 'Your name in the square')}</label><input id="fName" maxlength="16" autocomplete="nickname" value="${esc(p.name)}" placeholder="${L('Até 16 letras', 'Up to 16 letters')}"></div>
    <div><label for="fCity">${L('De que cidade és?', 'Which city are you from?')}</label><select id="fCity"><option value="">${L('Escolhe…', 'Choose…')}</option>${opts}</select>
      <input id="fOther" maxlength="24" placeholder="${L('Qual?', 'Which one?')}" value="${esc(p.other)}" style="margin-top:6px" ${p.city === '_' ? '' : 'hidden'}></div>
    <div><label>${L('Onde estás agora?', 'Where are you now?')}</label><div class="choice">
      <button type="button" data-m="praca" class="${p.mode !== 'apoio' ? 'on' : ''}"><b>${L('Na manif ou na acampada', 'At the protest or a camp')}</b><span>${L('Entras na praça com o teu boneco, a brilhar na cor da tua cidade.', 'You walk into the square with your avatar, glowing in your city’s colour.')}</span></button>
      <button type="button" data-m="apoio" class="${p.mode === 'apoio' ? 'on' : ''}"><b>${L('Longe, a apoiar', 'Far away, supporting')}</b><span>${L('Contas como apoio, vês a praça e escreves no mural.', 'You count as support, watch the square and write on the wall.')}</span></button>
    </div></div>
    <div id="lookBox"><label>${L('O teu boneco', 'Your avatar')}</label><div class="lookrow"><canvas id="lookCv" width="32" height="32"></canvas><button type="button" class="btnp sm" id="reroll">🎲 ${L('Outro visual', 'Another look')}</button></div></div>
  </div>
  <button class="btnp red" id="enter">${L('Entrar na praça →', 'Enter the square →')}</button><p class="help" id="formErr" style="color:#ff9d8f"></p>
  ${FOOT()}`;
  wireLang();
  const drawLook = () => { const c = $('lookCv'), g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.fillStyle = '#d9d3c3'; g.fillRect(0, 0, 32, 32); const city = $('fCity').value, a = auraOf(city === '_' ? '' : city); ell(g, 16, 27, 9, rgba(a, .3)); ell(g, 16, 27, 6, rgba(a, .55)); guy(g, 16, 27, { ...lookOf(profile.look) }); };
  const modeSync = () => { $('lookBox').hidden = profile.mode === 'apoio'; };
  $('fCity').addEventListener('change', () => { $('fOther').hidden = $('fCity').value !== '_'; drawLook(); });
  $('reroll').addEventListener('click', () => { profile.look = Math.floor(Math.random() * LOOKS); drawLook(); });
  for (const b of box.querySelectorAll('[data-m]')) b.addEventListener('click', () => { profile.mode = b.dataset.m; for (const x of box.querySelectorAll('[data-m]')) x.classList.toggle('on', x === b); modeSync(); });
  drawLook(); modeSync();
  $('enter').addEventListener('click', () => {
    const name = $('fName').value.trim(), city = $('fCity').value, other = $('fOther').value.trim();
    if (!name) { $('formErr').textContent = L('Escreve um nome (pode ser inventado).', 'Write a name (it can be made up).'); $('fName').focus(); return; }
    if (!city || (city === '_' && !other)) { $('formErr').textContent = L('Escolhe a tua cidade.', 'Choose your city.'); $('fCity').focus(); return; }
    profile.name = name; profile.city = city; profile.other = other;
    store.set('acampada-praca', JSON.stringify(profile));
    $('formErr').textContent = ''; $('enter').disabled = true; inside = false;
    audioInit(); connect();
  });
}

/* ================= start ================= */
makeDecor(); makeBG(); applyTexts();
$('bSound').classList.toggle('on', !muted); $('bSound').textContent = muted ? '♪̸' : '♪'; $('bZoom').textContent = zoom ? '－' : '＋';
addEventListener('resize', () => { if (!$('app').hidden) resize(); });
if (window.visualViewport) visualViewport.addEventListener('resize', () => { if (!$('app').hidden) resize(); });
document.addEventListener('gesturestart', e => e.preventDefault());
showStatus();
requestAnimationFrame(frame);
window.__praca = { people, get me() { return me; }, get mode() { return myMode; }, djPos, get mural() { return mural; }, send, skew(ms) { clockOff += ms; } };
})();
</script>
</body>
