<style>
:root{ --ink:#0b0a0a; --paper:#f4f1ea; --red:#b02a22; --redbox:#8b2320; --green:#4ba36f; --lime:#b6ff3b; --muted:#a39d97; color-scheme:dark; }
html{ height:100%; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; height:100%; overflow:hidden; background:var(--ink); color:var(--paper); font-family:Jost, Futura, "Trebuchet MS", sans-serif; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
button, input, select, textarea{ font:inherit; }
button{ cursor:pointer; touch-action:manipulation; }
.rough{ filter:url(#rough); }

/* the square: a bar on top, the square, the tools at the bottom (on wide screens the mural sits on the right) */
#app{ position:fixed; inset:0; display:grid; grid-template-rows:auto 1fr auto; padding:calc(env(safe-area-inset-top,0px) + 6px) calc(env(safe-area-inset-right,0px) + 6px) calc(env(safe-area-inset-bottom,0px) + 6px) calc(env(safe-area-inset-left,0px) + 6px); /* phones on their side: clear of the camera */ gap:6px; }
#app[hidden]{ display:none; }
#bar{ display:flex; align-items:center; gap:10px; background:var(--paper); color:var(--ink); border:2px solid var(--paper); padding:6px 8px; min-width:0; }
.logo{ font-weight:800; font-size:20px; line-height:1; color:var(--red); letter-spacing:.3px; white-space:nowrap; }
#where{ font:700 11px/1.15 Jost, sans-serif; text-transform:uppercase; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
#where small{ display:block; font-weight:500; color:#5b554f; text-transform:none; font-size:11px; }
.cnt{ display:flex; gap:10px; font:800 18px/1 Jost, sans-serif; white-space:nowrap; }
.cnt span small{ display:block; font:700 9px/1 Jost, sans-serif; text-transform:uppercase; letter-spacing:.4px; color:#5b554f; margin-top:2px; }
.ib{ background:#fff; color:var(--ink); border:2px solid var(--ink); font:800 12px/1 Jost, sans-serif; min-width:32px; height:30px; padding:0 7px; text-transform:uppercase; }
.ib.on{ background:var(--ink); color:#fff; }
#stage{ position:relative; min-height:0; overflow:hidden; border:2px solid var(--paper); background:#1d1830; }
#cv{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:pointer; }
#tools{ display:flex; gap:6px; }
.tb{ flex:1; border:none; background:var(--paper); color:var(--ink); font:800 16px/1 Jost, sans-serif; text-transform:uppercase; padding:11px 6px 9px; }
.tb small{ display:block; font:500 11px/1 Jost, sans-serif; text-transform:none; margin-top:3px; color:#5b554f; }
.tb.red{ background:var(--redbox); color:#fff; } .tb.red small{ color:#f0c9c4; }
.tb.green{ background:var(--green); color:var(--ink); } .tb.green small{ color:#1f3a2a; }
.tb.ink{ background:#16121a; color:var(--paper); box-shadow:inset 0 0 0 2px var(--paper); } .tb.ink small{ color:#c9c4c4; }
#agendaList{ overflow:auto; display:flex; flex-direction:column; gap:8px; }
.agev{ background:#f4f1ea; color:#0b0a0a; padding:8px 10px; display:grid; grid-template-columns:1fr auto; gap:2px 10px; align-items:center; }
.agev b{ font:800 15px/1.15 Jost, sans-serif; text-transform:uppercase; } .agev .when{ font:700 12px/1.2 Jost, sans-serif; color:#8b2320; text-transform:uppercase; }
.agev small{ grid-column:1; font:500 12px/1.3 "Helvetica Neue", Arial, sans-serif; color:#3a3a44; } .agev .now{ background:#b6ff3b; padding:1px 5px; margin-left:4px; color:#0b0a0a; }
.agev button{ grid-column:2; grid-row:1 / span 3; border:2px solid #0b0a0a; background:#fff; color:#0b0a0a !important; font:800 11px/1 Jost, sans-serif; text-transform:uppercase; padding:7px 8px 6px; }
#tour{ position:absolute; left:8px; right:8px; top:54px; z-index:4; display:flex; align-items:center; gap:10px; background:var(--lime); color:var(--ink); border:2px solid var(--ink); font:800 14px/1.25 Jost, sans-serif; padding:8px 10px; }
#tour[hidden]{ display:none; } #tour .tb2{ display:flex; gap:6px; margin-left:auto; } #tour button{ border:2px solid var(--ink); background:var(--ink); color:var(--lime); font:800 12px/1 Jost, sans-serif; text-transform:uppercase; padding:6px 8px 5px; white-space:nowrap; } #tour #tourSkip{ background:transparent; color:var(--ink); }
.tb.new{ position:relative; } .tb.new::after{ content:''; position:absolute; top:6px; right:8px; width:10px; height:10px; border-radius:50%; background:var(--lime); border:2px solid var(--ink); }
.tb.open{ outline:3px solid var(--lime); outline-offset:-3px; }
.tb:active{ transform:translateY(2px); }

/* sheets over the bottom of the square: phrases, gestures, the mural */
.sheet{ position:absolute; left:0; right:0; bottom:0; max-height:72%; display:flex; flex-direction:column; background:rgba(11,10,10,.94); border-top:2px solid var(--paper); padding:10px; z-index:3; }
.sheet[hidden]{ display:none; }
.sheet h3{ margin:0 0 8px; font:800 14px/1 Jost, sans-serif; text-transform:uppercase; letter-spacing:.6px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.sheet h3 button{ background:none; border:2px solid var(--paper); color:var(--paper); font:800 12px/1 Jost, sans-serif; padding:4px 8px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:6px; overflow:auto; }
.grid button{ background:var(--paper); color:var(--ink); border:none; font:700 14px/1.15 Jost, sans-serif; padding:9px 8px 8px; text-align:left; }
.grid button.wait{ opacity:.45; }
.gest{ grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); }
.grid button.wide{ grid-column:1 / -1; } .gest button.wide b{ display:inline; font-size:18px; margin-right:6px; }
.gest button{ text-align:center; } .gest button b{ display:block; font-size:24px; line-height:1.1; font-weight:400; }

/* the mural */
#muralList{ flex:1; min-height:60px; overflow:auto; display:flex; flex-direction:column; gap:6px; padding-right:2px; }
.msg{ background:var(--paper); color:var(--ink); padding:7px 9px 6px; position:relative; font:500 14px/1.3 "Helvetica Neue", Arial, sans-serif; word-wrap:break-word; }
.msg .who{ display:flex; align-items:center; gap:5px; font:700 11px/1 Jost, sans-serif; text-transform:uppercase; letter-spacing:.3px; margin-bottom:3px; color:#3a352e; }
.msg .dot{ width:9px; height:9px; border-radius:50%; border:1px solid var(--ink); flex:none; }
.msg .rep{ margin-left:auto; background:none; border:none; color:#8a837a; font:700 11px/1 Jost, sans-serif; padding:0 2px; }
.msg .rep:disabled{ color:#c4bdb3; cursor:default; }
.msg.mine{ background:#e4f5d6; }
.empty{ color:var(--muted); font-size:13px; text-align:center; padding:14px 0; }
.write{ display:flex; gap:6px; margin-top:8px; align-items:stretch; }
.write textarea{ flex:1; resize:none; height:52px; border:2px solid var(--paper); background:#fff; color:var(--ink); padding:6px 8px; font:500 15px/1.25 "Helvetica Neue", Arial, sans-serif; }
.write button{ border:none; background:var(--redbox); color:#fff; font:800 14px/1 Jost, sans-serif; text-transform:uppercase; padding:0 12px; }
.note{ display:flex; justify-content:space-between; gap:8px; font-size:11px; color:var(--muted); margin-top:4px; }
.note .err{ color:#ff9d8f; font-weight:700; }

/* who is here, by city */
.who-list{ display:flex; flex-wrap:wrap; gap:4px 10px; font:700 12px/1.3 Jost, sans-serif; margin:0 0 8px; }
.who-list span{ display:inline-flex; align-items:center; gap:4px; } .who-list i{ width:9px; height:9px; border-radius:50%; display:inline-block; }

#side{ display:contents; }
/* wide screens: the mural is always on the right */
@media (min-width: 900px) and (min-height: 520px){
  #app{ grid-template-columns:1fr 330px; grid-template-rows:auto 1fr auto; }
  #bar{ grid-column:1 / 3; }
  #stage{ grid-column:1; grid-row:2; }
  #tools{ grid-column:1; grid-row:3; }
  #side{ display:block; grid-column:2; grid-row:2 / 4; min-height:0; }
  #muralSheet{ position:static; max-height:none; height:100%; border:2px solid var(--paper); }
  #muralSheet[hidden]{ display:flex; }
  #tMural{ display:none; }
  #muralSheet .x{ display:none; }
}
#toast{ position:absolute; left:50%; top:10px; transform:translateX(-50%); background:var(--ink); color:var(--lime); border:2px solid var(--lime); font:700 13px/1.2 Jost, sans-serif; padding:6px 10px 5px; text-transform:uppercase; letter-spacing:.4px; z-index:4; max-width:90%; text-align:center; pointer-events:none; }
#toast[hidden]{ display:none; }
#djTag{ position:absolute; left:8px; bottom:8px; background:rgba(11,10,10,.8); color:var(--lime); font:700 11px/1 Jost, sans-serif; text-transform:uppercase; padding:5px 7px 4px; letter-spacing:.4px; z-index:2; pointer-events:none; }
#djTag[hidden]{ display:none; }
#alerta{ position:absolute; left:0; right:0; top:0; z-index:4; background:#d8261c; color:#fff; font:800 16px/1.2 Jost, sans-serif; padding:9px 12px 8px; border-bottom:3px solid #0b0a0a; animation:alertin .35s ease-out both; }
#alerta[hidden]{ display:none; } #alerta b{ display:inline-block; background:#fff; color:#d8261c; font:800 11px/1 Jost, sans-serif; letter-spacing:1px; text-transform:uppercase; padding:4px 6px 3px; margin-right:8px; vertical-align:2px; animation:liveb 1s steps(2) infinite; }
@keyframes alertin{ from{ transform:translateY(-100%); } to{ transform:none; } }
#aviso{ position:absolute; left:0; right:0; top:0; z-index:3; display:flex; align-items:center; gap:8px; background:var(--lime); color:var(--ink); font:800 15px/1.2 Jost, sans-serif; padding:8px 10px 7px; border-bottom:2px solid var(--ink); }
#aviso[hidden]{ display:none; } #aviso span{ flex:1; } #aviso span::before{ content:'📣 '; }
#aviso button{ background:none; border:none; font:800 16px/1 Jost, sans-serif; color:var(--ink); padding:2px 4px; }
.write.ro textarea{ background:#d9d3c3; } .write.ro button{ opacity:.5; }
.ctx{ position:absolute; left:50%; bottom:62px; transform:translateX(-50%); z-index:2; background:var(--redbox); color:#fff; border:2px solid #fff; font:800 15px/1 Jost, sans-serif; text-transform:uppercase; padding:11px 14px 9px; white-space:nowrap; box-shadow:0 3px 0 rgba(11,10,10,.5); }
.zoom.on{ background:var(--lime); }
.ctx:disabled{ background:#5b554f; } .ctx[hidden]{ display:none; }
#direto{ position:absolute; left:0; right:58px; bottom:0; z-index:2; background:#d8261c; color:#fff; padding:6px 10px 6px; font:700 14px/1.25 Jost, sans-serif; border-top:2px solid #0b0a0a; }
#direto[hidden]{ display:none; } #direto b{ display:inline-block; background:#fff; color:#d8261c; font:800 11px/1 Jost, sans-serif; letter-spacing:1px; text-transform:uppercase; padding:3px 6px 2px; margin-right:8px; vertical-align:1px; animation:liveb 1s steps(2) infinite; } @keyframes liveb{ 50%{ opacity:.55; } }
#direto small{ display:block; font:600 11px/1.2 Jost, sans-serif; opacity:.85; margin:3px 0 2px; }
.ride{ background:var(--paper); color:var(--ink); padding:10px 12px 9px; margin-top:6px; border-left:8px solid #ffd23a; } .ride b{ display:block; font:800 16px/1.15 Jost, sans-serif; } .ride span{ display:block; font:600 14px/1.3 Jost, sans-serif; margin-top:3px; } .ride small{ display:block; font:700 11px/1 Jost, sans-serif; text-transform:uppercase; letter-spacing:.5px; color:#5b554f; margin-top:5px; }
.npcline{ margin:0 0 10px; font:600 17px/1.3 Jost, sans-serif; background:#fff; color:var(--ink); padding:9px 11px 8px; position:relative; }
.npcline::after{ content:''; position:absolute; left:18px; bottom:-8px; border:8px solid transparent; border-top-color:#fff; border-bottom:0; }
.opts{ grid-template-columns:1fr; } .opts button{ font-size:15px; }
.npclab{ display:block; font:800 11px/1 Jost, sans-serif; text-transform:uppercase; letter-spacing:.6px; margin:12px 0 0; }
#npcBody{ overflow:auto; } #npcBody > button.ghost, .row2 .ghost{ margin-top:10px; background:transparent; color:var(--paper); border:2px solid var(--paper); font:800 13px/1 Jost, sans-serif; text-transform:uppercase; padding:8px 10px 7px; }
.redbtn{ margin-top:10px; background:var(--redbox); color:#fff; border:none; font:800 15px/1 Jost, sans-serif; text-transform:uppercase; padding:11px 14px 9px; }
.sheet.typing{ top:0; bottom:auto; border-top:0; border-bottom:2px solid var(--paper); }
.cartazIn{ width:100%; resize:none; border:2px solid var(--paper); background:#fff; color:var(--ink); padding:8px; font:700 18px/1.2 Jost, sans-serif; }
.seg{ display:flex; margin-top:6px; } .seg button{ flex:1; background:transparent; color:var(--paper); border:2px solid var(--paper); font:800 13px/1 Jost, sans-serif; text-transform:uppercase; padding:8px 4px 7px; } .seg button + button{ border-left:0; } .seg button.on{ background:var(--paper); color:var(--ink); } .seg button:disabled{ opacity:.35; text-decoration:line-through; }
.cols{ display:flex; gap:8px; margin-top:6px; } .cols button{ width:34px; height:34px; border:2px solid var(--paper); padding:0; } .cols button.on{ outline:3px solid var(--lime); outline-offset:2px; }
.cartaz.fmt-p{ font-size:16px; max-width:160px; margin:10px auto 4px; } .cartaz.fmt-m{ max-width:230px; margin:10px auto 4px; } .cartaz.fmt-g{ font-size:28px; margin:10px auto 4px; } .cartaz.fmt-f{ font-size:18px; padding:7px 12px; transform:rotate(0); border-width:3px 2px; margin:10px 0 4px; letter-spacing:1px; }
.cartaz{ background:#f2efe6; color:var(--ink); border:3px solid var(--ink); font:800 22px/1.15 Jost, sans-serif; text-transform:uppercase; padding:14px 12px; text-align:center; transform:rotate(-1.5deg); margin:4px 4px 10px; }
.dot{ display:inline-block; width:9px; height:9px; border-radius:50%; border:1px solid var(--ink); vertical-align:0; }
#fotoSheet{ top:0; max-height:none; } #fotoSheet h3{ flex:none; }
#fotoImg{ display:block; flex:1 1 auto; min-height:0; width:100%; object-fit:contain; margin:0 auto 8px; } /* the picture shrinks so the buttons always fit */
#fotoSheet .row2{ flex:none; } #fotoSheet .row2 .redbtn, #fotoSheet .row2 .ghost{ margin-top:0; }
.row2{ display:flex; gap:8px; justify-content:center; } .row2 button{ flex:1; max-width:220px; }
.zoom{ position:absolute; right:8px; bottom:8px; z-index:2; width:44px; height:44px; background:var(--paper); color:var(--ink); border:2px solid var(--ink); font:800 22px/1 Jost, sans-serif; padding:0; }
@media (max-width: 520px){ #where small{ display:none; } .logo{ font-size:17px; } .tb{ font-size:13px; padding:9px 3px 8px; } .tb small{ font-size:9.5px; } }

/* the entry and closed screens (the same poster style as the game's title screen) */
#ov{ position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; padding:calc(env(safe-area-inset-top,0px) + 16px) max(18px, calc(env(safe-area-inset-right,0px) + 10px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(18px, calc(env(safe-area-inset-left,0px) + 10px)); overflow:auto; text-align:center; background:var(--ink); }
#ov[hidden]{ display:none; }
#ov .wrapc{ margin:auto; width:100%; max-width:440px; }
#ov h1,#ov h2,#ov p{ margin:0; }
.langsw{ display:flex; justify-content:center; margin:0 auto 12px; } .langsw button{ background:transparent; color:var(--paper); border:2px solid var(--paper); font:800 12px/1 Jost, sans-serif; letter-spacing:1px; padding:5px 10px 4px; } .langsw button + button{ border-left:0; } .langsw button.on{ background:var(--paper); color:var(--ink); }
.p-red{ color:var(--red); font-weight:800; font-size:clamp(30px, 9.5vw, 42px); line-height:1; letter-spacing:.5px; text-transform:uppercase; }
.p-big{ font-weight:800; font-size:clamp(28px, 9vw, 40px); line-height:1.02; text-transform:uppercase; }
.p-mid{ font-weight:700; font-size:19px; line-height:1.15; margin-top:6px !important; text-transform:uppercase; }
.help{ font-family:"Helvetica Neue", Arial, sans-serif; font-size:13px; line-height:1.4; color:#c9c4c4; margin:12px auto 0 !important; max-width:30em; }
.live{ background:var(--paper); color:var(--ink); text-align:left; padding:10px 12px 9px; margin-top:14px; border-left:8px solid var(--red); }
.live b{ display:block; font:800 16px/1.15 Jost, sans-serif; text-transform:uppercase; }
.live span{ font:500 13px/1.35 "Helvetica Neue", Arial, sans-serif; }
.live + .live{ margin-top:6px; }
.badge{ display:inline-block; background:var(--lime); color:var(--ink); font:800 12px/1 Jost, sans-serif; letter-spacing:1px; text-transform:uppercase; padding:5px 8px 4px; margin-bottom:10px; }
.badge.off{ background:var(--muted); }
.form{ text-align:left; margin-top:16px; display:grid; gap:12px; }
.form label{ display:block; font:800 12px/1 Jost, sans-serif; text-transform:uppercase; letter-spacing:.6px; margin-bottom:5px; }
.form input, .form select{ width:100%; border:2px solid var(--paper); background:#fff; color:var(--ink); font:600 17px/1.2 Jost, sans-serif; padding:9px 10px 8px; border-radius:0; }
.choice{ display:grid; gap:6px; }
.choice button{ text-align:left; background:transparent; color:var(--paper); border:2px solid var(--paper); padding:10px 12px 9px; }
.choice button b{ display:block; font:800 16px/1.1 Jost, sans-serif; text-transform:uppercase; }
.choice button span{ font:500 13px/1.3 "Helvetica Neue", Arial, sans-serif; color:#c9c4c4; }
.choice button.on{ background:var(--paper); color:var(--ink); } .choice button.on span{ color:#3a352e; }
.lookrow{ display:flex; align-items:center; gap:12px; } .lookbtns{ display:flex; flex-direction:column; gap:8px; }
#lookEditor{ margin-top:6px; } #lookEditor label{ margin:12px 0 6px; }
.lookopts{ display:flex; flex-wrap:wrap; gap:6px; }
.lookopts .sw{ width:32px; height:32px; border:2px solid var(--paper); padding:0; } .lookopts .sw.on{ outline:3px solid var(--lime); outline-offset:2px; }
.lookopts .chip{ background:transparent; color:var(--paper); border:2px solid var(--paper); font:700 13px/1 Jost, sans-serif; padding:7px 9px 6px; } .lookopts .chip.on{ background:var(--paper); color:var(--ink); }
#lookCv{ width:120px; height:120px; image-rendering:pixelated; background:#d9d3c3; border:2px solid var(--paper); }
.btnp{ font-family:Jost, Futura, sans-serif; font-weight:800; font-size:17px; text-transform:uppercase; background:#fff; color:var(--ink); border:none; padding:11px 18px 9px; margin:16px 4px 0; text-decoration:none; display:inline-block; }
.btnp.red{ background:var(--redbox); color:#fff; }
.btnp.sm{ font-size:13px; padding:8px 12px 7px; margin:0; }
.ovtop{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin:0 0 12px; } .ovtop .langsw{ margin:0; } .btnp.back{ background:transparent; color:var(--paper); box-shadow:inset 0 0 0 2px var(--paper); }
.btnp:active{ transform:translateY(2px); }
.btnp:disabled{ opacity:.5; }
.foot{ margin-top:18px !important; font-size:11px; color:var(--muted); font-family:"Helvetica Neue", Arial, sans-serif; }
.foot a{ color:var(--paper); }
#ovMural{ text-align:left; margin-top:14px; display:flex; flex-direction:column; gap:6px; max-height:46vh; overflow:auto; }
:focus-visible{ outline:3px solid var(--lime); outline-offset:2px; }

/* phones on their side: room for the camera even if the browser reports no safe area */
@media (orientation: landscape) and (max-height: 520px) and (pointer: coarse){ #ov{ padding-left:max(52px, calc(env(safe-area-inset-left,0px) + 10px)) !important; padding-right:max(52px, calc(env(safe-area-inset-right,0px) + 10px)) !important; } }
#muralSheet{ left:calc(env(safe-area-inset-left,0px) + 6px); right:calc(env(safe-area-inset-right,0px) + 6px); } /* the sheet hangs from #app: keep it off the camera */
@media (orientation: landscape) and (max-height: 520px) and (pointer: coarse){ #muralSheet{ left:max(40px, calc(env(safe-area-inset-left,0px) + 6px)); right:max(40px, calc(env(safe-area-inset-right,0px) + 6px)); } #wallSheet{ padding-left:max(52px, calc(env(safe-area-inset-left,0px) + 10px)); padding-right:max(52px, calc(env(safe-area-inset-right,0px) + 10px)); } }

<script>

  { i: '👋', pt: 'Acenar', en: 'Wave' }, { i: '✊', pt: 'Punho', en: 'Fist' }, { i: '👏', pt: 'Palmas', en: 'Clap' },

  say: ['Gritar', 'Shout'], sayS: ['Palavras de ordem', 'Slogans'], gest: ['Gestos', 'Gestures'], gestS: ['Acenar, palmas…', 'Wave, clap…'],

function applyTexts() {
  document.documentElement.lang = LANG === 'en' ? 'en' : 'pt-PT';
  for (const el of document.querySelectorAll('[data-t]')) { const t = TXT[el.dataset.t]; if (t) el.textContent = L(t[0], t[1]); }

/* ================= the world: an isometric square, drawn like the game ================= */
const TW = 12, TH = 6;
let W = 22, H = 22, CXg = 11, CYg = 11;
const G0 = -8, G1 = 30; // the world around the square, in tiles
const PW = 48, PH = 32, PB = 8, WALL_X0 = 6, WALL_Y = -2.6, WALL_Z = 82; // the wall's top left corner on the building's face, in tiles and pixels
let OX = 0, OY = 0, WORLD_W = 0, WORLD_H = 0;
const iso = (gx, gy, z = 0) => ({ x: OX + (gx - gy) * TW, y: OY + (gx + gy) * TH - z });
const toWorld = (sx, sy) => { const a = (sx - OX) / TW, b = (sy - OY) / TH; return { gx: (a + b) / 2, gy: (b - a) / 2 }; };
const lerpY = (P, Q, x) => P.y + (Q.y - P.y) * ((x - P.x) / ((Q.x - P.x) || 1));

const shadeCache = new Map();
function shade(hex, f) { const k = hex + '|' + f; let o = shadeCache.get(k); if (o) return o; const n = parseInt(hex.slice(1, 7), 16), c = v => clamp(Math.round(v * f), 0, 255); o = '#' + ((1 << 24) | (c(n >> 16 & 255) << 16) | (c(n >> 8 & 255) << 8) | c(n & 255)).toString(16).slice(1); shadeCache.set(k, o); return o; }
function R(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
function vl(g, x, y0, y1, c) { const a = Math.round(y0), b = Math.round(y1); if (b < a) return; g.fillStyle = c; g.fillRect(x, a, 1, b - a + 1); }
function box(g, x0, y0, x1, y1, z0, h, cT, cL, cR) {
  const A = iso(x0, y0, z0 + h), B = iso(x1, y0, z0 + h), C = iso(x1, y1, z0 + h), D = iso(x0, y1, z0 + h);
  if (cR) for (let sx = Math.round(C.x); sx < Math.round(B.x); sx++) { const gy = x1 - (sx + .5 - OX) / TW; const by = OY + (x1 + gy) * TH - z0; vl(g, sx, by - h, by, typeof cR === 'function' ? cR(sx) : cR); }
  if (cL) for (let sx = Math.round(D.x); sx < Math.round(C.x); sx++) { const gx = (sx + .5 - OX) / TW + y1; const by = OY + (gx + y1) * TH - z0; vl(g, sx, by - h, by, typeof cL === 'function' ? cL(sx) : cL); }
  if (cT) for (let sx = Math.round(D.x); sx < Math.round(B.x); sx++) { const xc = sx + .5; const t = xc < A.x ? lerpY(D, A, xc) : lerpY(A, B, xc); const b = xc < C.x ? lerpY(D, C, xc) : lerpY(C, B, xc); vl(g, sx, t, b, cT); }
}
function ell(g, cx, cy, r, c, ry = r / 2) { const n = Math.round(r); for (let dx = -n; dx < n; dx++) { const e = Math.sqrt(Math.max(0, 1 - ((dx + .5) / r) ** 2)); vl(g, Math.round(cx) + dx, cy - ry * e, cy + ry * e, c); } }
function circ(g, cx, cy, r, c) { ell(g, cx, cy, r, c, r); }

// facades: the colours of Portuguese squares (ochre, rose, azulejo blue, white), red tiled roofs
const FACADES = ['#f2d7a0', '#e9b9a4', '#bcd3e6', '#f2efe6', '#d8e3c4', '#f0c98a', '#e4c9d9'];
function building(g, x0, y0, x1, y1, h, col, faceL) {
  const wall = col, dark = shade(col, .78), mid = shade(col, .9);

  // windows on the face that looks at the square
  const win = '#3a4f7a', lit = '#ffe9a3';
  for (let z = 10; z < h - 6; z += 13) {
    if (faceL) for (let gx = x0 + .6; gx < x1 - .3; gx += 1.05) { const p = iso(gx, y1, z); const on = hash(gx * 7 | 0, z) < .18; R(g, p.x - 1, p.y - 7, 3, 6, on ? lit : win); R(g, p.x - 1, p.y - 1, 3, 1, shade(col, .7)); }

let bg = null;
function makeBG() {
  OX = (G1 - G0) * TW; OY = 110 - (G0 + G0) * TH;
  WORLD_W = (G1 - G0) * 2 * TW; WORLD_H = OY + (G1 + G1) * TH + 20;
  bg = document.createElement('canvas'); bg.width = WORLD_W; bg.height = WORLD_H;
  const g = bg.getContext('2d'); g.imageSmoothingEnabled = false;
  g.fillStyle = '#2a2440'; g.fillRect(0, 0, WORLD_W, WORLD_H);
