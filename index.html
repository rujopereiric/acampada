let actx = null, muted = false, duck = 1; // duck: the game's own sounds go down while the saxophone plays
function tone(f, d, type = 'square', v = .045, when = 0) {
  if (muted || !actx) return;
  const t0 = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v * duck, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + d + .02);
}

    case 'bang': tone(55, .7, 'sawtooth', .16); tone(38, .9, 'square', .12, .02); tone(3800, 1.8, 'sine', .014, .15); break; // a stun grenade, then the ringing in the ears

    case 'concert': { const notes = [262, 330, 392, 523, 392, 330, 294, 349, 440, 587, 440, 349]; for (let i = 0; i < 48; i++) tone(notes[i % 12] * (i % 24 < 12 ? 1 : 1.122), .18, 'square', .03, i * .25); for (let i = 0; i < 24; i++) tone(i % 2 ? 98 : 131, .2, 'triangle', .06, i * .5); break; }

  if (S.followers) S.followers.forEach(o => addP(o.gx, o.gy, () => { const q = iso(o.gx, o.gy); guy(q.x, q.y, { ...o.look, moving: o.moving, step: o.step, flip: o.flip, back: o.back }); if (S.fasc && S.fasc.state === 'beat') { const x = Math.round(q.x), y = Math.round(q.y); R(x - 1, y - 20, 3, 1, '#b6ff3b'); R(x, y - 19, 1, 1, '#b6ff3b'); } }));
  if (S.journo) addP(S.journo.gx, S.journo.gy, () => drawJournalist(S.journo));
  if (S.rep) addP(S.rep.gx, S.rep.gy, () => drawReporter(S.rep));
  S.cars.forEach(c => add(c.gx, c.gy, () => drawCar(c)));
  { const pq = iso(S.player.gx, S.player.gy); for (const f of FRONTS) { const hid = covers(f, pq.x, pq.y - 8) || covers(f, pq.x, pq.y - 2); f.ghost += ((hid ? 1 : 0) - f.ghost) * .25;
    add(f.gx, f.gy, () => { ctx.globalAlpha = 1 - f.ghost * .65; ctx.drawImage(f.img, f.bx, f.by); ctx.globalAlpha = 1; }); } }
  if (S.ambush) S.ambush.gang.forEach(g => addP(g.gx, g.gy, () => drawFascist(g)));
  if (S.hcrate) add(S.hcrate.gx, S.hcrate.gy, () => drawHCrate(S.hcrate));
  if (S.cleaners) S.cleaners.crew.forEach(m => addP(m.gx, m.gy, () => drawSweeper(m)));
  if (S.drums) S.drums.crew.forEach(m => addP(m.gx, m.gy, () => drawDrummer(m, S.drums.kind)));
  if (S.choir) { const c = S.choir; c.members.forEach(m => addP(m.gx, m.gy, () => drawChorister(m, c))); }
  if (S.dj) { const d = S.dj; addP(d.gx, d.gy, () => drawDJ(d)); d.followers.forEach((f, i) => addP(f.gx, f.gy, () => drawDancer(f, i))); d.recruits.forEach((f, i) => addP(f.gx, f.gy, () => drawDancer(f, i))); }
  list.sort((a, b) => a.k - b.k).forEach(o => o.f());

  // night
  if (d > 0) {
    ctx.fillStyle = `rgba(18,8,64,${.45 * d})`; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    const glow = (x, y, r, col, a) => { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col.replace('A', a)); g.addColorStop(1, col.replace('A', 0)); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); };
    for (const dd of S.city.deco) if (dd.t === 'lamp') { const q = iso(dd.gx, dd.gy, 25); glow(q.x, q.y, 22, 'rgba(255,220,140,A)', .45 * d); }
    for (const t of S.tents) { const q = iso(t.gx, t.gy, 3); glow(q.x - 2, q.y, 8, 'rgba(255,190,90,A)', .35 * d); }
    if (S.concert) { const q = iso(S.concert.st.gx, S.concert.st.gy, 20); glow(q.x, q.y, 30, Math.floor(S.t * 4) % 2 ? 'rgba(255,95,200,A)' : 'rgba(57,225,255,A)', .5 * d); }
    if (S.dj && S.dj.state === 'party') { const q = iso((FLOOR.x0 + FLOOR.x1) / 2, (FLOOR.y0 + FLOOR.y1) / 2, 6); glow(q.x, q.y, 34, Math.floor(S.t * 4) % 2 ? 'rgba(255,95,200,A)' : 'rgba(182,255,59,A)', .5 * d); }
    for (const c of S.cars) if (c.state === 'drive') { const f = .55 * c.dir, q = c.axis === 'x' ? iso(c.gx + f, c.gy, 3) : iso(c.gx, c.gy + f, 3); glow(q.x, q.y, 9, 'rgba(255,240,190,A)', .5 * d); }
    if (S.van) { const q = iso(S.van.gx, S.van.gy, 16); glow(q.x, q.y, 24, Math.floor(S.t * 6) % 2 ? 'rgba(60,120,255,A)' : 'rgba(255,60,90,A)', .6); }
    if (S.donkey === 'giant' && S.city.donkey) { const q = iso(CX, CY + .6, 20); glow(q.x, q.y, 20, 'rgba(255,230,160,A)', .25 * d); }
    ctx.globalCompositeOperation = 'source-over';
  }

  for (const q of S.parts) {
    ctx.globalAlpha = Math.min(1, q.life * 2);
    if (q.type === 'spark') { R(q.x, q.y, 1, 1, q.col); if (q.life > .4) { R(q.x - 1, q.y, 3, 1, q.col); R(q.x, q.y - 1, 1, 3, q.col); } }
    else if (q.type === 'note') { R(q.x, q.y, 2, 2, q.col); R(q.x + 1, q.y - 4, 1, 4, q.col); R(q.x + 2, q.y - 4, 2, 1, q.col); }
    else { ctx.globalAlpha = Math.min(.7, q.life); R(q.x, q.y, 2, 2, '#ffffff'); }
  }
  ctx.globalAlpha = 1;
  drawKettleFx();
  if (mode === 'play') { drawTutArrow(); drawAim(); } // above the night, so the activists stand out
  drawChoirBubble();
  for (const f of S.floats) drawFloat(f);

  drawBanner(); syncMsgs();

      if (txt) drawFloat({ x: (VIEW.x0 + VIEW.x1) / 2, y: VIEW.y1 - 24, text: txt, color: '#b6ff3b', t: 1 }); }
    if (S.warned && !S.raid && Math.floor(S.t * 4) % 2) drawFloat({ x: (VIEW.x0 + VIEW.x1) / 2, y: VIEW.y1 - 10, text: 'Sirenes antes do amanhecer', color: '#ff8aa8', t: 1 });
    if (S.live > 0) { ctx.save(); ctx.translate(Math.round(VIEW.x0), Math.round(VIEW.y0)); R(4, 4, 46, 12, '#1b1464'); R(5, 5, 44, 10, '#2a1f7a'); R(8, 7, 5, 5, Math.floor(S.t * 3) % 2 ? '#ff3b3b' : '#7a1c1c'); ctx.font = '8px Silkscreen, monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ffffff'; ctx.fillText('LIVE ' + Math.ceil(S.live), 16, 10); ctx.restore(); }
  }
}

const PRACA_SRV = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? `http://${location.hostname}:8787` : 'https://praca.acampadapixel.pt';
let pracaState = null;
function pracaCheck() {
  if (location.protocol === 'file:') return;
  fetch(PRACA_SRV + '/estado', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(st => { if (!st) return; pracaState = st; const el = document.getElementById('pracaSlot'); if (el && mode === 'title') el.innerHTML = pracaButton(); }).catch(() => {});

function pracaButton() {
  if (!pracaState) return '';

  else if (n) {
    const f = o => new Intl.DateTimeFormat(LANG === 'en' ? 'en-GB' : 'pt-PT', { timeZone: 'Europe/Lisbon', ...o }).format(new Date(n.open));
    const ymd = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Lisbon' }), day = ymd.format(new Date(n.open));
    const d0 = ymd.format(new Date()), d1 = ymd.format(new Date(Date.now() + 864e5)), hm = f({ hour: '2-digit', minute: '2-digit' });

function makeStory(o) {

    `<h2 class="p-red rough cj-h">Um dia na praça</h2><p class="cj-sub">o que esperar e quando</p>

     <div class="cj-ev"><span class="cj-t">18–22</span><div><b>Hora de ponta</b>Chega mais gente. Pode passar uma bicicletada, que atrasa a polícia.</div></div>
