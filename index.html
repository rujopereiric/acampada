<style>
:root{
  --bg:#efeae2; --ink:#0b0a0a; --muted:#5b554f; --line:#0b0a0a; --panel:#ffffff;
  --red:#b02a22; --redbox:#8b2320; --green:#4ba36f; --white:#f4f1ea;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b0a0a; --ink:#f4f1ea; --muted:#a39d97; --line:#f4f1ea; --panel:#161414; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#0b0a0a; --ink:#f4f1ea; --muted:#a39d97; --line:#f4f1ea; --panel:#161414; color-scheme:dark; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:border-box; }
button{ touch-action:manipulation; }
body{ margin:0; min-height:100%; color:var(--ink); background:var(--bg); font-family:Jost, Futura, "Trebuchet MS", sans-serif; -webkit-tap-highlight-color:transparent; }
.wrap{ width:min(calc(100vw - 14px), 460px, max(300px, calc((100dvh - 260px) * 1.0667))); margin:6px auto 14px; }
/* computers: the column keeps its phone width and is scaled up to fill the window (see fit()) */
.pc body{ min-height:0; }
.pc .wrap{ width:460px; transform-origin:50% 0; }
.pc #ov .wrapc{ transform-origin:50% 50%; }
.mini[hidden]{ display:none; }
.rough{ filter:url(#rough); }
.hud{ background:var(--panel); border:2px solid var(--line); padding:8px 10px 9px; }
.top{ display:flex; align-items:center; gap:8px; }
.logo{ font-weight:800; font-size:22px; line-height:1; color:var(--red); letter-spacing:.3px; }
#city{ flex:1; min-width:0; font-weight:800; font-size:13px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#clock{ font-family:"Helvetica Neue", Arial, sans-serif; font-size:13px; text-decoration:underline; text-underline-offset:3px; white-space:nowrap; }

const FLOOR = { x0: 10.6, x1: 12.5, y0: 2.4, y1: 5.6 };
const CONGA_WP = [[.7, .7], [9.3, .7], [9.3, 9.3], [.7, 9.3]];
const DJ_LOOK = { skin: '#7a4a2c', hair: '#16121a', shirt: '#2f8a50', pants: '#2a2a3a' };

function spawnDJ() {

  let bi = 0, bd = 1e9; CONGA_WP.forEach((w, i) => { const k = Math.hypot(w[0] - d.gx, w[1] - d.gy); if (k < bd) { bd = k; bi = i; } });

function updDJ(dt) {

  const busy = d.state === 'conga' || d.state === 'party';
  if (d.beat <= 0) {
    d.beat = busy ? .5 : 1;
    if (busy || gd(d, S.player) < 4) skank(busy);
    if (d.state !== 'leave') { const q = iso(d.gx, d.gy, 16); S.parts.push({ x: q.x + (d.flip ? 4 : -4), y: q.y, vx: rnd(-5, 5), vy: -14, life: 1, type: 'note', col: pick(['#ff3b4e', '#ffd23a', '#3ec46d']) }); }
  }

  } else if (d.state === 'conga') {
    const w = CONGA_WP[d.wp % 4];
    if (moveEnt(d, w[0], w[1], 1.7, dt)) { d.wp++; d.legs++; }
    const last = d.trail[0];
    if (!last || Math.hypot(last[0] - d.gx, last[1] - d.gy) > .08) { d.trail.unshift([d.gx, d.gy]); if (d.trail.length > 400) d.trail.pop(); }

  }

/* ================= render ================= */
const STARS = Array.from({ length: 26 }, () => [Math.random() * W, Math.random() * 90, Math.random() * 6]);
function drawFloat(f) {
  ctx.font = '8px Silkscreen, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const T = f.text.toUpperCase(), w = Math.ceil(ctx.measureText(T).width) + 8, x = clamp(Math.round(f.x - w / 2), 1, W - w - 1), y = Math.round(f.y - 5);
  ctx.globalAlpha = Math.min(1, f.t * 2);
  R(x, y, w, 11, '#0b0a0a'); R(x, y + 10, w, 1, f.color);
  ctx.fillStyle = f.color; ctx.fillText(T, x + w / 2, y + 6);
  ctx.globalAlpha = 1;
}
function draw() {
  const d = S.dark;
  const sky = ctx.createLinearGradient(0, 0, 0, 140);
  sky.addColorStop(0, mix('#7fd6ff', '#0d0730', d)); sky.addColorStop(.6, mix('#c9b8ff', '#2a1458', d)); sky.addColorStop(1, mix('#ffd1f2', '#3b1a6e', d));
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  if (d > .2) for (const [x, y, k] of STARS) { const on = (Math.floor(S.t * 2 + k) % 4) !== 0; ctx.globalAlpha = d; R(x, y, 1, 1, '#ffffff'); if (on && k > 4) { R(x - 1, y, 3, 1, '#c9f6ff'); R(x, y - 1, 1, 3, '#c9f6ff'); } ctx.globalAlpha = 1; }
  else { ctx.globalAlpha = 1 - d; circ(ctx, 36, 26, 9, '#fff6c7'); circ(ctx, 34, 24, 4, '#ffffff'); ctx.globalAlpha = 1; }
  ctx.drawImage(bg, 0, 0);

  if (S.chain) { const c = S.chain, q = iso(c.gx, c.gy); ctx.fillStyle = 'rgba(57,225,255,.18)'; ctx.beginPath(); ctx.ellipse(q.x, q.y, c.r * TW * 1.414, c.r * TH * 1.414, 0, 0, Math.PI * 2); ctx.fill(); }

  if (S.choir && S.choir.state === 'sing') { const c = S.choir, q = iso(c.cx, c.cy); ctx.fillStyle = c.grandola ? 'rgba(255,59,78,.22)' : 'rgba(255,211,107,.2)'; ctx.beginPath(); ctx.ellipse(q.x, q.y, (CHOIR_R + .45) * TW * 1.414, (CHOIR_R + .45) * TH * 1.414, 0, 0, Math.PI * 2); ctx.fill(); }
  if (S.dj && S.dj.state === 'party') { const st = .45; for (let a = FLOOR.x0; a < FLOOR.x1 - .01; a += st) for (let b = FLOOR.y0; b < FLOOR.y1 - .01; b += st) { const c = ['#ff5fc8', '#39e1ff', '#b6ff3b', '#ffd36b'][(Math.floor((a + b) / st + S.t * 4)) % 4]; box(ctx, a, b, a + st, b + st, 0, 1, c, shade(c, .7), shade(c, .55)); } }
  const list = [];
  const add = (gx, gy, f) => list.push({ k: gx + gy, f });
  for (const dd of S.city.deco) {
    const fn = { lamp: () => drawLamp(dd), tree: () => drawTree(dd), palm: () => drawPalm(dd), fountain: () => drawFountain(dd.gx, dd.gy, false), chafariz: () => drawFountain(dd.gx, dd.gy, true), corcel: () => drawCorcel(dd), column: drawColumn, bin: () => drawBin(dd) }[dd.t];
    add(dd.gx, dd.gy, fn);
  }
  S.tents.forEach(t => add(t.gx, t.gy, () => drawTent(t)));
  S.stations.forEach(s => add(s.gx, s.gy, () => drawStation(s)));
  S.crates.forEach(c => add(c.gx, c.gy, () => drawCrate(c)));
  S.residents.forEach(r => add(r.gx, r.gy, () => { const q = iso(r.gx, r.gy); guy(q.x, q.y, { ...r.look, moving: r.moving, step: r.step, flip: r.flip, back: r.back }); }));
  S.arrivals.forEach(a => add(a.gx, a.gy, () => drawArrival(a)));
  S.police.forEach(o => add(o.gx, o.gy, () => drawCop(o)));
  add(S.player.gx, S.player.gy, drawPlayer);
  if (S.chain) { const c = S.chain, n = 14; for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2, gx = c.gx + Math.cos(a) * c.r, gy = c.gy + Math.sin(a) * c.r; add(gx, gy, () => { const q = iso(gx, gy); guy(q.x, q.y, { skin: SKIN[k % 5], hair: HAIR[k % 6], shirt: SHIRTS[k % 9], pants: '#2b2d55' }); if (c.helmet) { R(q.x - 3, q.y - 17, 7, 3, '#2f6bff'); R(q.x - 2, q.y - 17, 2, 1, '#9fd0ff'); } }); } }
  if (S.bikes) S.bikes.riders.forEach(r => add(r.gx, r.gy, () => { const q = iso(r.gx, r.gy); bike(q.x, q.y, r.flip, r.col, 5); guy(q.x, q.y - 5, { ...r.look, moving: true, step: S.t * 8, flip: r.flip }); }));
  if (S.tandem) add(S.tandem.gx, S.tandem.gy, () => drawTandem(S.tandem));
  if (S.van) add(S.van.gx, S.van.gy, drawVan);
  if (S.hcrate) add(S.hcrate.gx, S.hcrate.gy, () => drawHCrate(S.hcrate));
  if (S.cleaners) S.cleaners.crew.forEach(m => add(m.gx, m.gy, () => drawSweeper(m)));
  if (S.drums) S.drums.crew.forEach(m => add(m.gx, m.gy, () => drawDrummer(m)));
  if (S.choir) { const c = S.choir; c.members.forEach(m => add(m.gx, m.gy, () => drawChorister(m, c))); }
  if (S.dj) { const d = S.dj; add(d.gx, d.gy, () => drawDJ(d)); d.followers.forEach((f, i) => add(f.gx, f.gy, () => drawDancer(f, i))); d.recruits.forEach((f, i) => add(f.gx, f.gy, () => drawDancer(f, i))); }
  list.sort((a, b) => a.k - b.k).forEach(o => o.f());

  // night
  if (d > 0) {
    ctx.fillStyle = `rgba(18,8,64,${.5 * d})`; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    const glow = (x, y, r, col, a) => { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col.replace('A', a)); g.addColorStop(1, col.replace('A', 0)); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); };
    for (const dd of S.city.deco) if (dd.t === 'lamp') { const q = iso(dd.gx, dd.gy, 25); glow(q.x, q.y, 22, 'rgba(255,220,140,A)', .45 * d); }
    for (const t of S.tents) { const q = iso(t.gx, t.gy, 3); glow(q.x - 2, q.y, 8, 'rgba(255,190,90,A)', .35 * d); }
    if (S.concert) { const q = iso(S.concert.st.gx, S.concert.st.gy, 20); glow(q.x, q.y, 30, Math.floor(S.t * 4) % 2 ? 'rgba(255,95,200,A)' : 'rgba(57,225,255,A)', .5 * d); }
    if (S.dj && S.dj.state === 'party') { const q = iso(11.5, 4, 6); glow(q.x, q.y, 34, Math.floor(S.t * 4) % 2 ? 'rgba(255,95,200,A)' : 'rgba(182,255,59,A)', .5 * d); }
    if (S.van) { const q = iso(S.van.gx, S.van.gy, 16); glow(q.x, q.y, 24, Math.floor(S.t * 6) % 2 ? 'rgba(60,120,255,A)' : 'rgba(255,60,90,A)', .6); }
    if (S.donkey === 'giant' && S.city.donkey) { const q = iso(5, 5.6, 20); glow(q.x, q.y, 20, 'rgba(255,230,160,A)', .25 * d); }
    ctx.globalCompositeOperation = 'source-over';
  }

  for (const q of S.parts) {
    ctx.globalAlpha = Math.min(1, q.life * 2);
    if (q.type === 'spark') { R(q.x, q.y, 1, 1, q.col); if (q.life > .4) { R(q.x - 1, q.y, 3, 1, q.col); R(q.x, q.y - 1, 1, 3, q.col); } }
    else if (q.type === 'note') { R(q.x, q.y, 2, 2, q.col); R(q.x + 1, q.y - 4, 1, 4, q.col); R(q.x + 2, q.y - 4, 2, 1, q.col); }

  drawChoirBubble();

  if (mode === 'play') {

    if (S.live > 0) { R(4, 4, 46, 12, '#1b1464'); R(5, 5, 44, 10, '#2a1f7a'); R(8, 7, 5, 5, Math.floor(S.t * 3) % 2 ? '#ff3b3b' : '#7a1c1c'); ctx.font = '8px Silkscreen, monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ffffff'; ctx.fillText('LIVE ' + Math.ceil(S.live), 16, 10); }
  }
}

function show(html, variant = '') { ov.className = variant; ov.innerHTML = `<div class="wrapc">${html}</div>`; ov.hidden = false; ov.scrollTop = 0; fitOv(); }
function titleScreen() {
  mode = 'title';
  show(`<h2 class="p-red rough">PROTESTO</h2><p class="p-big rough">A acampada resiste</p><p class="p-mid rough">Junta-te a nós</p>${TENT}
  <p class="p-info rough">Porto · Lisboa · Coimbra<br>Braga · Faro</p>
  <p class="help">Mantém a acampada de pé e segura a praça quando a polícia chegar de madrugada.</p>
  <p class="help"><b>Manifestação: Não temos casa, ficam as tendas!</b><br>Sábado, 24 out. 2026, 15:00 · Marquês do Pombal → Rossio</p>
  <div style="display:flex;justify-content:center;gap:8px"><button class="btnp narrow" data-a="chapters">Junta-te →</button><button class="btnp narrow red" data-a="info">Informação</button></div>${FOOT}`);
}
function chapterScreen() {
  mode = 'chapters';
  const rows = CITIES.map((c, i) => `<button class="chap${cleared.has(i) ? ' done' : ''}" data-city="${i}"><span class="k">CAP. ${i + 1}</span><span><span class="n">${c.name}</span><span class="pl">${c.place} · ${c.tag.replace('&', '&amp;')}</span></span>${cleared.has(i) ? '<span class="ok">Resistiu</span>' : '<span></span>'}</button>`).join('');
  show(`<h2 class="p-red rough">ESCOLHE</h2><p class="p-big rough">a tua praça</p><p class="help">Joga as praças pela ordem que quiseres. Segura as cinco para ganhar.</p><div class="chaps">${rows}</div>
  <button class="btnp red" data-a="title">← Voltar</button>${cleared.size ? '<button class="btnp" data-a="reset">Recomeçar tudo</button>' : ''}`);
}
function introScreen() {
  mode = 'intro'; const c = CITIES[cityIdx];
  show(`<h2 class="p-red rough">PROTESTO</h2><p class="p-big rough">Acampada ${c.name}</p><p class="p-mid rough">Junta-te a nós</p>${TENT}
  <p class="p-info rough">Dia 1<br>17 horas<br>${c.place}</p><p class="help">${c.intro}</p><button class="btnp" data-a="go">Lá estaremos!</button>${FOOT}`);
}
function buildMenu() {
  if (mode !== 'play') return; mode = 'menu';
  const list = Object.entries(STATIONS).map(([k, d]) => { const has = !!stationOf(k), dis = has || S.supplies < d.cost;
    return `<button class="need" data-build="${k}" ${dis ? 'disabled' : ''}>${d.name} <span class="c">${has ? '✓' : '· ' + d.cost}</span><small>${d.desc}</small></button>`; }).join('');
  show(`<h2>Coisas que<br>precisamos:</h2>${list}<p class="help" style="color:#b6c7bc">Tens ${S.supplies} materiais. Monta-se mesmo ao teu lado.</p><button class="btnp" data-a="resume">Fechar</button>`, 'needs');
}
function assembly() {
  if (mode !== 'play' || S.asmCd > 0) return;
  if (people() < 8) { float(S.player.gx, S.player.gy, 'Precisas de mais gente', '#ff8aa8'); return; }
  mode = 'menu';
  const pool = PERKS.filter(p => !S.perks.has(p.id)).sort(() => Math.random() - .5).slice(0, 3);
  if (!pool.length) { mode = 'play'; return; }
  show(`<h2>Assembleia<br><u>popular 19:00</u></h2><p class="help">Todas as pessoas têm voz. Vota no que a acampada faz a seguir.</p>
  <div class="slots one">${pool.map(p => `<button class="slot" data-perk="${p.id}"><span class="n">${p.name}</span><span class="d">${p.desc}</span></button>`).join('')}</div>`, 'green');
}

    <div><span class="when">Sáb 24 · 15:00</span><span class="what">Lisboa<small>Marcha do Marquês do Pombal ao Rossio</small></span></div>
    <div><span class="when">Sáb 24 · 15:00</span><span class="what">Braga<small>Assembleia popular até à meia-noite, Av. Central / Praça da República. Música, cultura, comida. Já Não Dá Mais</small></span></div>
    <div><span class="when">Sáb 24 · 15:00</span><span class="what">Aveiro<small>Assembleia popular, Praça da República. Não Dá Mais P’ra Viver Assim</small></span></div>
    <div><span class="when">Sáb 24</span><span class="what">Porto<small>Manifestação na Praça D. João I, hora a anunciar. @acampadaporto</small></span></div>
  </div>${CHECK}</div>`],
  () => ['', `<div class="ad center"><span class="adtag">Informação</span><h2 class="p-red rough">14 de novembro</h2><p class="p-big rough">Casa para viver</p>
    <p class="p-mid rough">Não nos vão roubar<br>o direito a morar</p>
    <div class="agenda" style="color:#fff"><div><span class="when">15:00</span><span class="what">Lisboa<small>Alameda D. Afonso Henriques</small></span></div>
    <div><span class="when">15:00</span><span class="what">Porto<small>Praça do Marquês</small></span></div>
    <div><span class="when">Hora a anunciar</span><span class="what">Ponta Delgada<small>Portas da Cidade</small></span></div>
    <div><span class="when">+</span><span class="what">Dezenas de cidades<small>O Porta a Porta espera que se juntem cerca de 30</small></span></div></div>
    <p class="src">Plataforma Casa Para Viver (@casaparaviver.pt) com Porta a Porta (@portaaportadh).</p>${CHECK}</div>`],
  () => ['', `<div class="ad center"><span class="adtag">Informação</span><h2 class="p-red rough">Sabias que…</h2>
    <p class="big rough">+16,5%</p><p class="p-mid rough">Subida dos preços das casas<br>num ano, a maior da UE</p>
    <p class="help">2.º trimestre de 2026 face ao mesmo período de 2025. Fonte: Eurostat, 1 de outubro de 2026.</p>
    <p class="big rough" style="margin-top:14px">~2%</p><p class="p-mid rough">das casas são<br>habitação pública</p>
    <p class="help">Fonte: inquérito à habitação do INE (dados de 2015), um número muito citado pelo governo e pelos movimentos pela habitação.</p></div>`]
];
function showAd(next) {
  mode = 'ad'; adNext = next;
  const [variant, html] = ADS[adIdx % ADS.length](); adIdx++;
  try { localStorage.setItem('acampada3-ad', String(adIdx)); } catch (e) {}
  sfx('win');
  show(`${html}<div class="center" style="text-align:center"><button class="btnp${variant === 'adred' ? '' : ' red'}" data-a="adnext">Continua a lutar!</button></div>`, variant);
}
function levelClear() { showAd(finishLevel); }
let infoReturn = null, infoIdx = 0;
function openInfo(i) {
  if (mode !== 'info') { if (!['play', 'paused', 'title', 'chapters', 'intro'].includes(mode)) return; infoReturn = mode; }
  mode = 'info'; infoIdx = (i + ADS.length) % ADS.length;
  const [variant, html] = ADS[infoIdx]();
  const main = variant === 'adred' ? '' : ' red', side = variant === 'adred' ? ' red' : '';
  show(`${html.replace('Informação</span>', `Informação · ${infoIdx + 1}/${ADS.length}</span>`)}<div style="display:flex;justify-content:center;gap:6px"><button class="btnp arrow${side}" data-a="infoprev" aria-label="Cartaz anterior">←</button><button class="btnp narrow${main}" data-a="infoclose">Continua a lutar!</button><button class="btnp arrow${side}" data-a="infonext" aria-label="Próximo cartaz">→</button></div>`, variant);
}
function closeInfo() {
  const r = infoReturn; infoReturn = null;
  if (r === 'play') { ov.hidden = true; mode = 'play'; }
  else if (r === 'paused') { mode = 'play'; pause(); }
  else if (r === 'chapters') chapterScreen();
  else if (r === 'intro') introScreen();
  else titleScreen();
}
function finishLevel() {
  const first = !cleared.has(cityIdx); cleared.add(cityIdx); saveCleared();
  if (cleared.size === CITIES.length && first) {
    mode = 'win';
    show(`<h2 class="p-red rough">VITÓRIA</h2><p class="p-big rough">A luta continua</p>${TENT}<p class="p-info rough">Cinco praças<br>uma exigência:<br>casas para viver</p>
    <p class="help">Com acampadas nas cinco praças e o apoio sempre a crescer, o governo recua e abre negociações sobre a habitação.</p><button class="btnp" data-a="chapters">Escolher praça</button>${FOOT}`);
    return;
  }
  mode = 'clear';
  let nxt = -1; for (let k = 1; k <= CITIES.length; k++) { const j = (cityIdx + k) % CITIES.length; if (!cleared.has(j)) { nxt = j; break; } }
  show(`<span class="box-red rough">Comunicado<br>de imprensa</span><br><span class="box-white rough">${S.city.name} resiste</span>
  <p class="help">${S.city.clear || 'O Algarve aguentou.'}</p><p class="stat rough">${S.tents.length} tendas · ${fmt(crowd())} pessoas · ${1 + Math.floor((S.clock - 6) / 24)} dias · ${cleared.size}/5 praças</p>
  <div>${nxt >= 0 ? `<button class="btnp" data-city="${nxt}">Próxima: ${CITIES[nxt].name} →</button>` : ''}<button class="btnp red" data-a="chapters">Escolher praça</button></div>`, 'comunicado');
}
function gameOver() {
  sfx('lose'); mode = 'over';
  show(`<span class="box-red rough">Comunicado<br>de imprensa</span><br><span class="box-white rough">Sobre a<br>repressão policial</span>
  <p class="help">Ao amanhecer, enquanto a maioria das pessoas dormia, a polícia levou as tendas de ${S.city.place}. ${S.detained} pessoas detidas.</p>
  <p class="help">A acampada foi desmontada. A assembleia popular já decidiu: a acampada resiste, com ou sem tendas.</p>
  <div><button class="btnp" data-a="retry">Voltamos às 19h</button><button class="btnp red" data-a="chapters">Escolher praça</button></div>`, 'comunicado');
}
function pause() {
  if (mode !== 'play') return; mode = 'paused';
  const day = 1 + Math.floor((S.clock - 6) / 24);
  show(`<h2>Acampada<br><u>Dia ${day}</u></h2>
  <div class="slots"><div class="slot"><span class="t">17:00</span><span class="n">Skate</span></div><div class="slot"><span class="t">19:00</span><span class="n">Assembleia popular</span></div>
  <div class="slot"><span class="t">18:00</span><span class="n">Coros</span><span class="d">(ensaio aberto)</span></div><div class="slot"><span class="t">20:30</span><span class="n">Jantar popular</span></div></div>
  <p class="help">Em pausa.</p><button class="btnp" data-a="resume">Voltar →</button><button class="btnp" data-a="chapters">Praças</button>`, 'green');
}
function audioOn() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (actx && actx.state === 'suspended') actx.resume(); }
function begin() { ov.hidden = true; mode = 'play'; float(S.player.gx, S.player.gy, pcMQ.matches ? 'Clica para andar' : 'Toca para andar', '#ffffff', 26); }
ov.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return; audioOn();
  if (b.dataset.build) { build(b.dataset.build); ov.hidden = true; mode = 'play'; return; }
  if (b.dataset.perk) { const id = b.dataset.perk; S.perks.add(id); S.asmCd = 75;
    if (id === 'caixa') S.supplies = Math.min(20, S.supplies + 6); if (id === 'comunicado') S.support = Math.min(100, S.support + 15);
    const pk = PERKS.find(p => p.id === id); float(S.player.gx, S.player.gy, pk.name, '#c9b8ff', 26); ov.hidden = true; mode = 'play'; return; }
  const a = b.dataset.a;
  if (b.dataset.city) { cityIdx = +b.dataset.city; newLevel(); introScreen(); return; }
  if (a === 'chapters') chapterScreen();
  else if (a === 'title') titleScreen();
  else if (a === 'reset') { cleared.clear(); saveCleared(); chapterScreen(); }
  else if (a === 'retry') { newLevel(); introScreen(); }
  else if (a === 'info') openInfo(0);
  else if (a === 'infoprev') openInfo(infoIdx - 1);
  else if (a === 'infonext') openInfo(infoIdx + 1);
  else if (a === 'infoclose') closeInfo();
  else if (a === 'adnext') { const f = adNext; adNext = null; if (f) f(); }
  else if (a === 'go') begin();
  else if (a === 'resume') { ov.hidden = true; mode = 'play'; }
});

/* ================= input ================= */
let dragging = false;
function setTarget(e) {
  const r = cv.getBoundingClientRect();
  const w = toWorld((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H + 3);
  let gx = clamp(w.gx, .15, 9.85), gy = clamp(w.gy, .15, 9.85);
  if (blockedAt(gx, gy)) { let b = null, bd = 1e9; for (let yy = 0; yy < N; yy++) for (let xx = 0; xx < N; xx++) { if (blockedAt(xx + .5, yy + .5)) continue; const d = Math.hypot(xx + .5 - gx, yy + .5 - gy); if (d < bd) { bd = d; b = [xx + .5, yy + .5]; } } if (b) [gx, gy] = b; }
  S.player.tx = gx; S.player.ty = gy;
}
cv.addEventListener('pointerdown', e => { if (mode !== 'play') return; audioOn(); dragging = true; setTarget(e); try { cv.setPointerCapture(e.pointerId); } catch (_) {} });
cv.addEventListener('pointermove', e => { if (dragging && mode === 'play') setTarget(e); });
cv.addEventListener('pointerup', () => dragging = false); cv.addEventListener('pointercancel', () => dragging = false);
const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };
addEventListener('keydown', e => {
  if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = true; if (mode === 'play') e.preventDefault(); return; }
  const k = e.key.toLowerCase();
  if (k === 'i') { if (mode === 'info') closeInfo(); else openInfo(0); return; }
  if (k === 'f' && !$('full').hidden) { $('full').click(); return; }
  if (k === 'c') doChain(); else if (k === 'l') doLive(); else if (k === 'b') buildMenu(); else if (k === 'v') assembly();
  else if (k === 'e' || k === ' ') { if (mode === 'play' && ctxCache && ctxCache.ok) { ctxCache.fn(); e.preventDefault(); } }
  else if (k === 'p' || k === 'escape') { if (mode === 'play') pause(); else if (mode === 'paused' || mode === 'menu') { ov.hidden = true; mode = 'play'; } }
});
addEventListener('keyup', e => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });
$('btnChain').addEventListener('click', doChain);
$('btnLive').addEventListener('click', doLive);
$('btnBuild').addEventListener('click', buildMenu);
$('btnVote').addEventListener('click', assembly);
$('ctxBtn').addEventListener('click', () => { const c = contextAction(); if (c && c.ok) { c.fn(); hudT = 0; } });
$('info').addEventListener('click', () => openInfo(0));
$('mute').addEventListener('click', () => { muted = !muted; $('mute').textContent = muted ? '×' : '♪'; $('mute').setAttribute('aria-label', muted ? 'Ligar o som' : 'Desligar o som'); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ================= bigger on computers ================= */
// with a mouse, the whole column is scaled up to fill the window height; phones and tablets keep the normal layout
const wrap = document.querySelector('.wrap'), pcMQ = matchMedia('(hover: hover) and (pointer: fine)');
let zoom = 1;
const isPC = () => pcMQ.matches && innerWidth >= 600;
function fit() {
  const pc = isPC();
  document.documentElement.classList.toggle('pc', pc);
  $('help').textContent = pcMQ.matches ? 'Clica na praça para andar · teclas: WASD ou setas, E, C, L, B, V, P' + (document.fullscreenEnabled ? ', F' : '') : 'Toca na praça para andar.';
  wrap.style.transform = ''; wrap.style.marginBottom = ''; zoom = 1;
  if (pc) {
    // measure with the context button showing, so the column still fits when it pops up
    const cb = $('ctxBtn'), was = cb.hidden; cb.hidden = false;
    const h = wrap.offsetHeight + 20; cb.hidden = was;
    const z = Math.min((innerHeight - 4) / h, (innerWidth - 24) / 460);
    if (z > 1.02) { zoom = z; wrap.style.transform = `scale(${z.toFixed(3)})`; wrap.style.marginBottom = `${Math.round(14 + (h - 20) * (z - 1))}px`; }
  }
  fitOv();
}
// overlay screens grow by the same amount, but never past the window height
function fitOv() {
  const c = ov.querySelector('.wrapc'); if (!c) return;
  c.style.transform = '';
  if (zoom <= 1 || ov.hidden) return;
  const z = Math.min(zoom, (innerHeight - 40) / c.offsetHeight);
  if (z > 1.02) c.style.transform = `scale(${z.toFixed(3)})`;
}
addEventListener('resize', fit);
pcMQ.addEventListener && pcMQ.addEventListener('change', fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
// full screen button, only where the browser supports it (not on iPhone)
const fullEl = document.documentElement;
if (document.fullscreenEnabled && pcMQ.matches) {
  $('full').hidden = false;
  $('full').addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); else fullEl.requestFullscreen().catch(() => {}); });
  document.addEventListener('fullscreenchange', () => $('full').setAttribute('aria-label', document.fullscreenElement ? 'Sair do ecrã inteiro' : 'Ecrã inteiro'));
}

/* ================= loop ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (mode === 'play') update(dt); else S.t += dt;
  songTick(); choirTick();
  draw();
  hudT -= dt; if (hudT <= 0) { hud(); hudT = .1; }
  requestAnimationFrame(frame);
}
cityIdx = 1; newLevel(); S.clock = 21.5; S.dark = 1;
for (let i = 0; i < 9; i++) { const t = addTent(); if (t) { t.occ = 2; t.pop = 0; } }
cityIdx = 0;
titleScreen();
fit();
requestAnimationFrame(frame);
window.__acampada = { choirSong: { full: () => semanaNotes(0), note: choirNote, bpm: SEMANA.bpm }, get S() { return S; }, update: dt => update(dt), draw: () => draw(), setMode: m => { mode = m; }, newLevel: i => { cityIdx = i; newLevel(); } };
})();
</script>
