<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acampada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Jost:wght@700;800&family=Chakra+Petch:wght@400;600;700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efeae2; --ink:#0b0a0a; --muted:#5b554f; --line:#0b0a0a; --panel:#ffffff;
  --red:#b02a22; --redbox:#8b2320; --green:#4ba36f; --white:#f4f1ea;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b0a0a; --ink:#f4f1ea; --muted:#a39d97; --line:#f4f1ea; --panel:#161414; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#0b0a0a; --ink:#f4f1ea; --muted:#a39d97; --line:#f4f1ea; --panel:#161414; color-scheme:dark; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:border-box; }
button{ touch-action:manipulation; }
body{ margin:0; min-height:100%; color:var(--ink); background:var(--bg); font-family:Jost, Futura, "Trebuchet MS", sans-serif; -webkit-tap-highlight-color:transparent; }
.wrap{ width:min(calc(100vw - 14px), 460px, max(300px, calc((100dvh - 260px) * 1.0667))); margin:6px auto 14px; }
/* computers: the column keeps its phone width and is scaled up to fill the window (see fit()) */
.pc body{ min-height:0; }
.pc .wrap{ width:460px; transform-origin:50% 0; }
.pc #ov .wrapc{ transform-origin:50% 50%; }
.mini[hidden]{ display:none; }
.rough{ filter:url(#rough); }
.hud{ background:var(--panel); border:2px solid var(--line); padding:8px 10px 9px; }
.top{ display:flex; align-items:center; gap:8px; }
.logo{ font-weight:800; font-size:22px; line-height:1; color:var(--red); letter-spacing:.3px; }
#city{ flex:1; min-width:0; font-weight:800; font-size:13px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#clock{ font-family:"Helvetica Neue", Arial, sans-serif; font-size:13px; text-decoration:underline; text-underline-offset:3px; white-space:nowrap; }
.mini{ font:inherit; font-weight:800; font-size:13px; color:var(--ink); background:none; border:2px solid var(--line); padding:0 7px; cursor:pointer; line-height:20px; }
.hudbody{ display:flex; gap:8px; align-items:flex-end; }
.hudL{ flex:1; min-width:0; }
.pm{ margin:0; width:84px; flex:none; display:flex; flex-direction:column; align-items:center; }
.pm svg{ display:block; width:84px; height:auto; overflow:visible; transform-origin:50% 100%; transition:transform .5s; }
.pm figcaption{ position:relative; z-index:1; background:var(--panel); padding:0 3px; font-family:"Helvetica Neue", Arial, sans-serif; font-size:10px; letter-spacing:.4px; text-transform:uppercase; margin-top:2px; }
.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin:7px 0 6px; }
.stats div{ display:flex; flex-direction:column; }
.stats dt{ font-family:"Helvetica Neue", Arial, sans-serif; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); }
.stats dd{ margin:0; font-weight:800; font-size:22px; line-height:1.05; }
.bar{ display:grid; grid-template-columns:70px 1fr; align-items:center; gap:6px; margin-top:4px; font-family:"Helvetica Neue", Arial, sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
.bar i{ display:block; height:10px; border:2px solid var(--line); background:transparent; }
.bar b{ display:block; height:100%; width:0; transition:width .25s; }
#bM{ background:var(--green); } #bS{ background:var(--ink); } #bP{ background:var(--red); }
.stage{ position:relative; margin-top:8px; border:2px solid var(--line); background:#0b0a0a; }
canvas{ display:block; width:100%; height:auto; aspect-ratio:256/240; image-rendering:pixelated; image-rendering:crisp-edges; touch-action:none; }
.act{ font-family:Jost, Futura, sans-serif; font-weight:800; font-size:15px; line-height:1.05; text-transform:uppercase; border:2px solid var(--line); padding:8px 4px 6px; cursor:pointer; color:#0b0a0a; background:#f4f1ea; }
.act small{ display:block; font-family:"Helvetica Neue", Arial, sans-serif; font-weight:400; font-size:10.5px; text-transform:none; margin-top:2px; opacity:.8; }
.act:active{ transform:translateY(2px); }
.act:disabled{ opacity:.4; cursor:default; }
.act.red{ background:var(--redbox); color:#fff; border-color:var(--redbox); }
.act.green{ background:var(--green); color:#0b0a0a; border-color:var(--green); }
.act.ink{ background:var(--ink); color:var(--bg); }
.act:focus-visible,.mini:focus-visible{ outline:3px solid #ffd23a; outline-offset:2px; }
#ctxBtn{ width:100%; margin-top:8px; background:#fff; color:var(--redbox); border-color:#fff; font-size:17px; padding:9px 6px 7px; box-shadow:inset 0 0 0 2px var(--redbox); }
#ctxBtn[hidden]{ display:none; }
.actions{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px; }
.help{ font-family:"Helvetica Neue", Arial, sans-serif; font-size:11.5px; color:var(--muted); margin:9px 2px 0; line-height:1.4; text-transform:uppercase; letter-spacing:.3px; }
@media (prefers-reduced-motion: reduce){ .bar b{ transition:none; } }
#ov{ position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 16px); overflow:auto; text-align:center; color:#fff; background:#0b0a0a; font-family:Jost, Futura, "Trebuchet MS", sans-serif; }
#ov[hidden]{ display:none; }
#ov .wrapc{ position:relative; z-index:1; margin:auto; width:100%; max-width:460px; }
.rough{ filter:url(#rough); }
#ov h2,#ov p{ margin:0; }
.p-red{ color:#b02a22; font-weight:800; font-size:clamp(30px, 9.5vw, 42px); line-height:1; letter-spacing:.5px; }
.p-big{ font-weight:800; font-size:clamp(32px, 10vw, 44px); line-height:1.02; text-transform:uppercase; }
.p-mid{ font-weight:700; font-size:22px; line-height:1.15; margin-top:6px !important; text-transform:uppercase; }
.p-info{ font-weight:800; font-size:22px; line-height:1.12; text-transform:uppercase; }
.tent{ display:block; margin:12px auto 10px; width:150px; height:auto; }
.chaps{ display:grid; gap:8px; margin:14px auto 0; max-width:420px; }
.chap{ display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; text-align:left; background:transparent; color:#fff; border:2px solid #f4f1ea; padding:8px 12px 6px; cursor:pointer; font-family:Jost, Futura, sans-serif; }
.chap:active{ transform:translateY(2px); }
.chap .k{ color:#b02a22; font-weight:800; font-size:14px; }
.chap .n{ font-weight:800; font-size:22px; line-height:1; text-transform:uppercase; }
.chap .pl{ display:block; font-family:"Helvetica Neue", Arial, sans-serif; font-size:12px; font-weight:400; color:#c9c4c4; margin-top:2px; }
.chap .ok{ font-weight:800; font-size:11px; color:#0b0a0a; background:#4ba36f; padding:2px 6px; text-transform:uppercase; }
.chap.done{ border-color:#4ba36f; }
.chap:focus-visible{ outline:3px solid #ffd23a; outline-offset:3px; }
.foot{ font-weight:800; font-size:11px; letter-spacing:.6px; margin-top:8px !important; opacity:.9; }
#ov .help{ text-transform:none; letter-spacing:0; font-family:"Helvetica Neue", Arial, sans-serif; font-weight:400; font-size:13px; line-height:1.4; color:#c9c4c4; margin:12px auto 0 !important; max-width:30em; }
#ov.comunicado{ background:rgba(118,24,20,.8); -webkit-backdrop-filter:grayscale(1) contrast(1.35) brightness(.75); backdrop-filter:grayscale(1) contrast(1.35) brightness(.75); }
#ov.comunicado::before{ content:""; position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(rgba(0,0,0,.4) 1px, transparent 1.5px); background-size:4px 4px; }
.box-red{ display:inline-block; background:#8b2320; color:#fff; padding:8px 14px 6px; font-weight:800; font-size:29px; line-height:1.05; text-transform:uppercase; }
.box-white{ display:inline-block; background:#fff; color:#8b2320; padding:6px 12px 4px; margin-top:14px; font-weight:800; font-size:19px; line-height:1.12; text-transform:uppercase; }
#ov.comunicado .help{ color:#fff; }
.comunicado .stat{ font-weight:800; font-size:16px; margin-top:10px !important; text-transform:uppercase; }
.btnp{ font-family:Jost, Futura, sans-serif; font-weight:800; font-size:18px; text-transform:uppercase; background:#fff; color:#0b0a0a; border:none; padding:11px 22px 9px; margin:16px 5px 0; cursor:pointer; }
.btnp.red{ background:#8b2320; color:#fff; }
.btnp.arrow{ padding:9px 13px 7px; margin:16px 0 0; }
.btnp.narrow{ margin:16px 0 0; white-space:nowrap; font-size:16px; padding:10px 12px 8px; }
.btnp:active{ transform:translateY(2px); }
#ov.needs{ background:#232425; color:#4ba36f; font-family:"Helvetica Neue", Arial, sans-serif; }
.needs h2{ font-weight:400; font-size:33px; line-height:1.08; text-transform:uppercase; text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:5px; margin-bottom:10px !important; }
.need{ display:block; width:100%; background:none; border:none; color:#4ba36f; font-family:inherit; font-size:25px; line-height:1.05; text-transform:uppercase; cursor:pointer; padding:7px 0; }
.need small{ display:block; font-size:12.5px; line-height:1.3; text-transform:none; color:#b6c7bc; margin-top:2px; }
.need .c{ font-size:14px; vertical-align:middle; opacity:.85; }
.need:disabled{ opacity:.35; cursor:default; }
#ov.needs .btnp{ font-family:inherit; font-weight:700; background:#4ba36f; color:#232425; }
#ov.adred{ background:#8b2320; color:#fff; }
.adtag{ display:inline-block; font-family:"Helvetica Neue", Arial, sans-serif; font-size:11px; letter-spacing:.6px; text-transform:uppercase; border:1.5px solid currentColor; padding:1px 6px; margin-bottom:10px; opacity:.85; }
.ad{ text-align:left; }
.ad .k{ font-family:"Helvetica Neue", Arial, sans-serif; font-size:13px; text-transform:uppercase; text-align:right; letter-spacing:.3px; }
.ad .rule{ height:6px; background:#fff; margin:10px 0; }
.ad .t{ font-weight:800; font-size:clamp(34px, 11vw, 50px); line-height:.98; text-transform:uppercase; }
.ad .cols{ display:flex; justify-content:space-between; gap:12px; font-size:clamp(17px, 5.4vw, 22px); line-height:1.12; text-transform:uppercase; }
.ad .cols div:last-child{ text-align:right; }
.ad .cols b{ font-weight:800; }
.ad .src{ font-family:"Helvetica Neue", Arial, sans-serif; font-size:11.5px; line-height:1.35; opacity:.85; margin-top:12px !important; }
.ad .big{ font-weight:800; font-size:clamp(60px, 20vw, 88px); line-height:.9; }
.ad .center,.ad.center{ text-align:center; }
.ad .p-red{ text-transform:uppercase; }
.agenda{ display:grid; gap:9px; margin-top:12px; text-align:left; }
.agenda div{ display:grid; grid-template-columns:76px 1fr; gap:8px; align-items:baseline; }
.agenda .when{ font-size:13px; text-decoration:underline; text-underline-offset:3px; }
.agenda .what{ font-size:20px; line-height:1.05; text-transform:uppercase; }
.agenda .what small{ display:block; font-size:12px; text-transform:none; line-height:1.3; }
.needlist{ font-size:clamp(20px, 6.4vw, 27px); line-height:1.06; text-transform:uppercase; text-align:center; margin-top:8px !important; }
#ov.green{ background:#4ba36f; color:#161616; font-family:"Helvetica Neue", Arial, sans-serif; }
.green h2{ font-weight:400; font-size:36px; line-height:1.02; text-transform:uppercase; }
.green h2 u{ text-decoration-thickness:3px; text-underline-offset:5px; }
#ov.green .help{ color:#163a24; }
.slots{ display:grid; grid-template-columns:1fr 1fr; gap:14px 14px; margin-top:16px; text-align:left; }
.slot{ background:none; border:none; padding:0; color:#161616; font-family:inherit; text-align:left; cursor:pointer; }
.slot:nth-child(even){ text-align:right; }
.slot .t{ font-size:13px; text-decoration:underline; }
.slot .n{ display:block; font-size:22px; line-height:1.02; text-transform:uppercase; margin-top:2px; }
.slot .d{ display:block; font-size:12px; line-height:1.3; margin-top:3px; color:#163a24; }
.slots.one{ grid-template-columns:1fr; }
.slots.one .slot:nth-child(even){ text-align:left; }
#ov.green .btnp{ font-family:inherit; font-weight:700; background:#161616; color:#4ba36f; }
.arrow{ font-size:34px; line-height:1; }
.btnp:focus-visible,.need:focus-visible,.slot:focus-visible{ outline:3px solid #ffd23a; outline-offset:3px; }
.jelly{ position:relative; font:inherit; font-weight:700; font-size:14px; color:#1b1464; cursor:pointer; padding:10px 12px; border:2px solid var(--edge); border-radius:999px;
  background:linear-gradient(180deg,#a8f7ff,#2cc4ea); box-shadow:inset 0 -3px 6px rgba(0,0,0,.18), 0 3px 0 var(--edge); overflow:hidden; }
.jelly::before{ content:""; position:absolute; left:10%; right:10%; top:2px; height:42%; border-radius:999px; background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0)); pointer-events:none; }
.jelly:active{ transform:translateY(2px); box-shadow:inset 0 -3px 6px rgba(0,0,0,.18), 0 1px 0 var(--edge); }
.jelly:disabled{ filter:grayscale(.75); opacity:.55; cursor:default; }
.jelly:focus-visible,.mini:focus-visible,.card:focus-visible{ outline:3px solid #ffd36b; outline-offset:2px; }
.pink{ background:linear-gradient(180deg,#ffc2ec,#ff5fc8); }
.lime{ background:linear-gradient(180deg,#e9ffb8,#8ee03a); }
.lav{ background:linear-gradient(180deg,#eee6ff,#a98bff); }
.gold{ background:linear-gradient(180deg,#fff2bf,#ffc53d); }

#ctxBtn{ width:100%; margin-top:9px; }
#ctxBtn[hidden]{ display:none; }
.actions{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:9px; }
.actions .jelly{ padding:9px 2px; font-size:12.5px; line-height:1.15; }
.help{ font-size:12px; color:var(--muted); margin:9px 4px 0; line-height:1.4; }
@media (prefers-reduced-motion: reduce){ #bP{ animation:none; } .bar b{ transition:none; } }
</style>
</head>

    mode = 'win';
    show(`<h2 class="p-red rough">VITÓRIA</h2><p class="p-big rough">A luta continua</p>${TENT}<p class="p-info rough">Cinco praças<br>uma exigência:<br>casas para viver</p>
    <p class="help">Com acampadas nas cinco praças e o apoio sempre a crescer, o governo recua e abre negociações sobre a habitação.</p><button class="btnp" data-a="chapters">Escolher praça</button>${FOOT}`);
    return;
  }
  mode = 'clear';
  let nxt = -1; for (let k = 1; k <= CITIES.length; k++) { const j = (cityIdx + k) % CITIES.length; if (!cleared.has(j)) { nxt = j; break; } }
  show(`<span class="box-red rough">Comunicado<br>de imprensa</span><br><span class="box-white rough">${S.city.name} resiste</span>
  <p class="help">${S.city.clear || 'O Algarve aguentou.'}</p><p class="stat rough">${S.tents.length} tendas · ${fmt(crowd())} pessoas · ${1 + Math.floor((S.clock - 6) / 24)} dias · ${cleared.size}/5 praças</p>
  <div>${nxt >= 0 ? `<button class="btnp" data-city="${nxt}">Próxima: ${CITIES[nxt].name} →</button>` : ''}<button class="btnp red" data-a="chapters">Escolher praça</button></div>`, 'comunicado');
}
function gameOver() {
  sfx('lose'); mode = 'over';
  show(`<span class="box-red rough">Comunicado<br>de imprensa</span><br><span class="box-white rough">Sobre a<br>repressão policial</span>
  <p class="help">Ao amanhecer, enquanto a maioria das pessoas dormia, a polícia levou as tendas de ${S.city.place}. ${S.detained} pessoas detidas.</p>
  <p class="help">A acampada foi desmontada. A assembleia popular já decidiu: a acampada resiste, com ou sem tendas.</p>
  <div><button class="btnp" data-a="retry">Voltamos às 19h</button><button class="btnp red" data-a="chapters">Escolher praça</button></div>`, 'comunicado');
}
function pause() {
  if (mode !== 'play') return; mode = 'paused';
  const day = 1 + Math.floor((S.clock - 6) / 24);
  show(`<h2>Acampada<br><u>Dia ${day}</u></h2>
  <div class="slots"><div class="slot"><span class="t">17:00</span><span class="n">Skate</span></div><div class="slot"><span class="t">19:00</span><span class="n">Assembleia popular</span></div>
  <div class="slot"><span class="t">18:00</span><span class="n">Coros</span><span class="d">(ensaio aberto)</span></div><div class="slot"><span class="t">20:30</span><span class="n">Jantar popular</span></div></div>
  <p class="help">Em pausa.</p><button class="btnp" data-a="resume">Voltar →</button><button class="btnp" data-a="chapters">Praças</button>`, 'green');
}
function audioOn() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (actx && actx.state === 'suspended') actx.resume(); }
function begin() { ov.hidden = true; mode = 'play'; float(S.player.gx, S.player.gy, pcMQ.matches ? 'Clica para andar' : 'Toca para andar', '#ffffff', 26); }
ov.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return; audioOn();
  if (b.dataset.build) { build(b.dataset.build); ov.hidden = true; mode = 'play'; return; }
  if (b.dataset.perk) { const id = b.dataset.perk; S.perks.add(id); S.asmCd = 75;
    if (id === 'caixa') S.supplies = Math.min(20, S.supplies + 6); if (id === 'comunicado') S.support = Math.min(100, S.support + 15);
    const pk = PERKS.find(p => p.id === id); float(S.player.gx, S.player.gy, pk.name, '#c9b8ff', 26); ov.hidden = true; mode = 'play'; return; }
  const a = b.dataset.a;
  if (b.dataset.city) { cityIdx = +b.dataset.city; newLevel(); introScreen(); return; }
  if (a === 'chapters') chapterScreen();
  else if (a === 'title') titleScreen();
  else if (a === 'reset') { cleared.clear(); saveCleared(); chapterScreen(); }
  else if (a === 'retry') { newLevel(); introScreen(); }
  else if (a === 'info') openInfo(0);
  else if (a === 'infoprev') openInfo(infoIdx - 1);
  else if (a === 'infonext') openInfo(infoIdx + 1);
  else if (a === 'infoclose') closeInfo();
  else if (a === 'adnext') { const f = adNext; adNext = null; if (f) f(); }
  else if (a === 'go') begin();
  else if (a === 'resume') { ov.hidden = true; mode = 'play'; }
});

/* ================= input ================= */
let dragging = false;
function setTarget(e) {
  const r = cv.getBoundingClientRect();
  const w = toWorld((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H + 3);
  let gx = clamp(w.gx, .15, 9.85), gy = clamp(w.gy, .15, 9.85);
  if (blockedAt(gx, gy)) { let b = null, bd = 1e9; for (let yy = 0; yy < N; yy++) for (let xx = 0; xx < N; xx++) { if (blockedAt(xx + .5, yy + .5)) continue; const d = Math.hypot(xx + .5 - gx, yy + .5 - gy); if (d < bd) { bd = d; b = [xx + .5, yy + .5]; } } if (b) [gx, gy] = b; }
  S.player.tx = gx; S.player.ty = gy;
}
cv.addEventListener('pointerdown', e => { if (mode !== 'play') return; audioOn(); dragging = true; setTarget(e); try { cv.setPointerCapture(e.pointerId); } catch (_) {} });
cv.addEventListener('pointermove', e => { if (dragging && mode === 'play') setTarget(e); });
cv.addEventListener('pointerup', () => dragging = false); cv.addEventListener('pointercancel', () => dragging = false);
const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };
addEventListener('keydown', e => {
  if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = true; if (mode === 'play') e.preventDefault(); return; }
  const k = e.key.toLowerCase();
  if (k === 'i') { if (mode === 'info') closeInfo(); else openInfo(0); return; }
  if (k === 'f' && !$('full').hidden) { $('full').click(); return; }
  if (k === 'c') doChain(); else if (k === 'l') doLive(); else if (k === 'b') buildMenu(); else if (k === 'v') assembly();
  else if (k === 'e' || k === ' ') { if (mode === 'play' && ctxCache && ctxCache.ok) { ctxCache.fn(); e.preventDefault(); } }
  else if (k === 'p' || k === 'escape') { if (mode === 'play') pause(); else if (mode === 'paused' || mode === 'menu') { ov.hidden = true; mode = 'play'; } }
});
addEventListener('keyup', e => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });
$('btnChain').addEventListener('click', doChain);
$('btnLive').addEventListener('click', doLive);
$('btnBuild').addEventListener('click', buildMenu);
$('btnVote').addEventListener('click', assembly);
$('ctxBtn').addEventListener('click', () => { const c = contextAction(); if (c && c.ok) { c.fn(); hudT = 0; } });
$('info').addEventListener('click', () => openInfo(0));
$('mute').addEventListener('click', () => { muted = !muted; $('mute').textContent = muted ? '×' : '♪'; $('mute').setAttribute('aria-label', muted ? 'Ligar o som' : 'Desligar o som'); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ================= bigger on computers ================= */
// with a mouse, the whole column is scaled up to fill the window height; phones and tablets keep the normal layout
const wrap = document.querySelector('.wrap'), pcMQ = matchMedia('(hover: hover) and (pointer: fine)');
let zoom = 1;
const isPC = () => pcMQ.matches && innerWidth >= 600;
function fit() {
  const pc = isPC();
  document.documentElement.classList.toggle('pc', pc);
  $('help').textContent = pcMQ.matches ? 'Clica na praça para andar · teclas: WASD ou setas, E, C, L, B, V, P' + (document.fullscreenEnabled ? ', F' : '') : 'Toca na praça para andar.';
  wrap.style.transform = ''; wrap.style.marginBottom = ''; zoom = 1;
  if (pc) {
    // measure with the context button showing, so the column still fits when it pops up
    const cb = $('ctxBtn'), was = cb.hidden; cb.hidden = false;
    const h = wrap.offsetHeight + 20; cb.hidden = was;
    const z = Math.min((innerHeight - 4) / h, (innerWidth - 24) / 460);
    if (z > 1.02) { zoom = z; wrap.style.transform = `scale(${z.toFixed(3)})`; wrap.style.marginBottom = `${Math.round(14 + (h - 20) * (z - 1))}px`; }
  }
  fitOv();
}
// overlay screens grow by the same amount, but never past the window height
function fitOv() {
  const c = ov.querySelector('.wrapc'); if (!c) return;
  c.style.transform = '';
  if (zoom <= 1 || ov.hidden) return;
  const z = Math.min(zoom, (innerHeight - 40) / c.offsetHeight);
  if (z > 1.02) c.style.transform = `scale(${z.toFixed(3)})`;
}
addEventListener('resize', fit);
pcMQ.addEventListener && pcMQ.addEventListener('change', fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
// full screen button, only where the browser supports it (not on iPhone)
const fullEl = document.documentElement;
if (document.fullscreenEnabled && pcMQ.matches) {
  $('full').hidden = false;
  $('full').addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); else fullEl.requestFullscreen().catch(() => {}); });
  document.addEventListener('fullscreenchange', () => $('full').setAttribute('aria-label', document.fullscreenElement ? 'Sair do ecrã inteiro' : 'Ecrã inteiro'));
}

/* ================= loop ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (mode === 'play') update(dt); else S.t += dt;
  songTick();
  draw();
  hudT -= dt; if (hudT <= 0) { hud(); hudT = .1; }
  requestAnimationFrame(frame);
}
cityIdx = 1; newLevel(); S.clock = 21.5; S.dark = 1;
for (let i = 0; i < 9; i++) { const t = addTent(); if (t) { t.occ = 2; t.pop = 0; } }
cityIdx = 0;
titleScreen();
fit();
requestAnimationFrame(frame);
window.__acampada = { get S() { return S; }, update: dt => update(dt), draw: () => draw(), setMode: m => { mode = m; }, newLevel: i => { cityIdx = i; newLevel(); } };
})();
</script>
</body>
</html>
